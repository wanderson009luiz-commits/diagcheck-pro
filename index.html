<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Avaliação técnica de carros usados: checklist com pesos, reparos estimados, FIPE ajustada pela quilometragem e oferta máxima.">
<meta name="theme-color" content="#0c0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DiagCheck">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DiagCheck Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: mesa de avaliação premium — trilho lateral grafite no desktop, barra inferior no celular.
   Cada avaliação é um dossiê em 6 etapas: Veículo → Checklist → OBD → Reparos → Negócio → Laudo.
   Assinatura visual: velocímetro de nota (0–100) e placa Mercosul. */
:root{
  --bg:#0c0d10; --surface:#14161a; --surface-2:#1b1e23; --line:#2a2e35; --line-soft:#1f2228;
  --fg:#e9ebee; --fg-2:#a7adb6; --fg-3:#6f7680;
  --silver:#c9ced6; --silver-hi:#f3f5f8; --silver-lo:#8a919b; --ink-on-silver:#0c0d10;
  --ok:#5fb08a; --good:#8fb3d9; --warn:#d6a24a; --bad:#e0645c;
  --ok-bg:rgba(95,176,138,.12); --good-bg:rgba(143,179,217,.12); --warn-bg:rgba(214,162,74,.12); --bad-bg:rgba(224,100,92,.12);
  --plate-blue:#1f3f8f;
  --metal:linear-gradient(115deg,#7f8690 0%,#e9edf2 28%,#9aa1ab 46%,#f5f7fa 64%,#8d949e 100%);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --line:#d5d9df; --line-soft:#e4e7eb;
  --fg:#121419; --fg-2:#4b525c; --fg-3:#7a818b;
  --silver:#3b4048; --silver-hi:#121419; --silver-lo:#6b727c; --ink-on-silver:#f6f7f9;
  --ok:#2f8a63; --good:#3a6ea5; --warn:#a8741a; --bad:#c2423a;
  --ok-bg:rgba(47,138,99,.10); --good-bg:rgba(58,110,165,.10); --warn-bg:rgba(168,116,26,.10); --bad-bg:rgba(194,66,58,.10);
  --metal:linear-gradient(115deg,#3a3f47 0%,#8d949e 30%,#2b2f35 52%,#9aa1ab 72%,#3a3f47 100%);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --line:#d5d9df; --line-soft:#e4e7eb;
  --fg:#121419; --fg-2:#4b525c; --fg-3:#7a818b;
  --silver:#3b4048; --silver-hi:#121419; --silver-lo:#6b727c; --ink-on-silver:#f6f7f9;
  --ok:#2f8a63; --good:#3a6ea5; --warn:#a8741a; --bad:#c2423a;
  --ok-bg:rgba(47,138,99,.10); --good-bg:rgba(58,110,165,.10); --warn-bg:rgba(168,116,26,.10); --bad-bg:rgba(194,66,58,.10);
  --metal:linear-gradient(115deg,#3a3f47 0%,#8d949e 30%,#2b2f35 52%,#9aa1ab 72%,#3a3f47 100%);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line-soft);padding:28px 18px;display:flex;flex-direction:column;gap:28px;background:var(--bg)}
.brand{display:flex;flex-direction:column;gap:4px;padding-inline:8px}
.brand-name{font-family:var(--f-display);font-size:26px;font-weight:400;line-height:1;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px;border:0;background:none;border-radius:8px;color:var(--fg-2);text-align:left;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.nav button:hover{color:var(--fg);background:var(--surface)}
.nav button[aria-current="true"]{color:var(--fg);background:var(--surface-2)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--fg-3);padding-inline:8px;display:flex;flex-direction:column;gap:8px}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg-3)}
.dot.on{background:var(--ok)}
.main{min-width:0;padding:36px clamp(16px,4vw,56px) 104px}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

/* type */
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-3)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.4vw,46px);line-height:1.05;margin:0;text-wrap:balance}
h1 em{font-style:italic;color:var(--fg-2)}
h2{font-family:var(--f-display);font-weight:400;font-size:25px;margin:0;line-height:1.15;text-wrap:balance}
h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--fg-2);margin:0}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.small{font-size:13px}
.hairline{height:1px;background:var(--metal);opacity:.55;border:0;margin:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--silver-lo)}
.btn.primary{background:var(--silver-hi);color:var(--ink-on-silver);border-color:transparent}
.btn.primary:hover{background:var(--silver)}
.btn.ghost{border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{color:var(--fg);background:var(--surface)}
.btn.danger{color:var(--bad);border-color:transparent}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.input{width:100%;height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);outline:none}
textarea.input{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--silver-lo)}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--fg-3);font-size:13px;pointer-events:none}
.money .input{padding-left:38px;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:24px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--fg-3);margin:0}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:end}
.hero p{margin:12px 0 0;max-width:48ch;color:var(--fg-2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:18px 4px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat+.stat{border-left:1px solid var(--line-soft);padding-left:20px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--fg-3)}

/* list */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:18px;align-items:center;padding:16px 4px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;width:100%;color:inherit}
.item:first-child{border-top:1px solid var(--line-soft)}
.item:hover{background:var(--surface)}
.item-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:13px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-right{text-align:right;font-size:13px;color:var(--fg-2);display:flex;flex-direction:column;gap:2px}
.item-right b{font-weight:500;color:var(--fg);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);color:var(--fg-2);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:transparent;background:var(--ok-bg)}
.pill.good{color:var(--good);border-color:transparent;background:var(--good-bg)}
.pill.warn{color:var(--warn);border-color:transparent;background:var(--warn-bg)}
.pill.bad{color:var(--bad);border-color:transparent;background:var(--bad-bg)}
.empty{padding:40px 24px;text-align:center;border:1px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--fg-2);max-width:46ch}

/* placa Mercosul */
.plate{display:inline-flex;flex-direction:column;width:96px;border-radius:5px;overflow:hidden;border:1.5px solid #20242b;background:#fbfbfc;flex:none}
.plate i{display:block;height:9px;background:var(--plate-blue);color:#fff;font-style:normal;font-size:6px;letter-spacing:.3em;text-align:center;line-height:9px;font-family:var(--f-body);font-weight:600}
.plate b{font-family:var(--f-mono);font-weight:500;color:#15181d;font-size:15px;letter-spacing:.08em;text-align:center;line-height:22px}
.plate.lg{width:150px}.plate.lg i{height:13px;line-height:13px;font-size:8px}.plate.lg b{font-size:23px;line-height:34px}

/* anel pequeno de nota */
.ring{--p:0;--c:var(--ok);width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line-soft) 0);display:grid;place-items:center;flex:none}
.ring span{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.item:hover .ring span{background:var(--surface)}

/* velocímetro */
.gauge{width:100%;max-width:260px;display:block;margin-inline:auto}
.gauge .trk{fill:none;stroke:var(--line-soft);stroke-width:12}
.gauge .zone{fill:none;stroke-width:3;opacity:.7}
.gauge .val{fill:none;stroke-width:12;stroke-linecap:round}
.gauge .tick{stroke:var(--fg-3);stroke-width:1}
.gauge .tick.maj{stroke:var(--fg-2);stroke-width:1.5}
.gauge .tl{fill:var(--fg-3);font-family:var(--f-mono);font-size:8px}
.gauge .n{fill:var(--fg);font-family:var(--f-display);font-size:44px}
.gauge .cl{font-family:var(--f-body);font-size:9.5px;letter-spacing:.18em}

/* editor */
.ed-head{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.saved{font-size:12px;color:var(--fg-3)}
.steps{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.steps::-webkit-scrollbar{display:none}
.steps button{border:0;background:none;padding:14px 12px 13px;color:var(--fg-3);font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.steps button .n{font-family:var(--f-mono);font-size:11px}
.steps button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--silver)}
.steps button:hover{color:var(--fg)}
.badge{font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad-bg);color:var(--bad);display:inline-grid;place-items:center}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-2)}
.bar{width:110px;height:4px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--silver)}

/* checklist */
.sys{border-top:1px solid var(--line-soft)}
.sys:last-child{border-bottom:1px solid var(--line-soft)}
.sys summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px 4px;cursor:pointer}
.sys summary::-webkit-details-marker{display:none}
.sys summary .t{font-family:var(--f-display);font-size:21px;flex:1;min-width:0}
.sys summary .w{font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
.chev{width:16px;height:16px;stroke:var(--fg-3);fill:none;stroke-width:1.6;transition:transform .2s;flex:none}
.sys[open] .chev{transform:rotate(180deg)}
.sys-body{padding:0 4px 18px}
.ck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:12px 0;border-top:1px dashed var(--line-soft);align-items:center}
.ck:first-of-type{border-top:0}
.ck-name{font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ck-name small{font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;background:none;height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;color:var(--fg-3)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"][data-v="ok"]{background:var(--ok-bg);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="atencao"]{background:var(--warn-bg);color:var(--warn)}
.seg button[aria-pressed="true"][data-v="critico"]{background:var(--bad-bg);color:var(--bad)}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--surface-2);color:var(--fg-2)}
.ck-note{grid-column:1/-1}
.ck-note .input{height:38px;font-size:13.5px}

/* FIPE */
.fipe-box{border:1px solid var(--line-soft);border-radius:12px;padding:18px;background:var(--surface-2);display:flex;flex-direction:column;gap:14px}
.src{font-size:12px;display:inline-flex;gap:6px;align-items:center}

/* obd */
.obd-entry{display:grid;grid-template-columns:minmax(0,220px) auto 1fr;gap:12px;align-items:end}
.codes{display:flex;flex-direction:column;gap:12px}
.code{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 18px;padding:18px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface);align-items:start}
.code-id{font-family:var(--f-mono);font-size:22px;letter-spacing:.04em;line-height:1.1}
.code-meta{font-size:13px;color:var(--fg-2)}
.code-meta ul{margin:6px 0 0;padding-left:18px}
.code-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sev{width:4px;align-self:stretch;border-radius:2px;background:var(--line)}
.sev.alta{background:var(--bad)}.sev.media{background:var(--warn)}.sev.baixa{background:var(--ok)}
.anatomy{display:flex;gap:4px;font-family:var(--f-mono);font-size:11.5px;color:var(--fg-3);margin-top:8px;flex-wrap:wrap}
.anatomy span{padding:3px 7px;border:1px solid var(--line-soft);border-radius:4px}

/* reparos */
.rep{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 0;border-top:1px solid var(--line-soft)}
.rep:first-child{border-top:0}
.rep .range{font-size:12.5px;color:var(--fg-3)}
.rep .money{width:150px}
.rep .money .input{height:38px;text-align:right}
.rep .edited .input{border-color:var(--warn)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.sum b{font-family:var(--f-display);font-weight:400;font-size:30px}

/* negócio */
.kmadj{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
.kmadj>div{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kmadj>div+div{border-left:1px solid var(--line-soft)}
.kmadj b{font-weight:500;font-variant-numeric:tabular-nums}
.kmadj .foot{grid-column:1/-1;border-left:0!important;border-top:1px solid var(--line-soft);flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.res{border:1px solid var(--line-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.res b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.res small{font-size:12.5px;color:var(--fg-2)}
.res.pos b{color:var(--ok)} .res.neg b{color:var(--bad)}
.res.offer{background:var(--surface-2);border-color:var(--line)}
.verdict{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:12px;font-size:14px}
.verdict.ok{background:var(--ok-bg)} .verdict.warn{background:var(--warn-bg)} .verdict.bad{background:var(--bad-bg)}
.verdict strong{display:block;font-weight:600}

/* laudo */
.report{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:28px;align-items:start}
.report-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:72px}
.find{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 14px;padding:12px 0;border-top:1px solid var(--line-soft);align-items:baseline}
.find:first-of-type{border-top:0}
.find .k{font-size:12.5px;color:var(--fg-3);grid-column:2/4}
.cats{display:flex;flex-direction:column}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line-soft);align-items:center}
.cat:first-child{border-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0;width:100%}
.kv dt{color:var(--fg-3)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--silver-hi);color:var(--ink-on-silver);padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.notice{padding:12px 16px;border-radius:10px;background:var(--warn-bg);font-size:13.5px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:var(--bad-bg);font-size:13.5px}
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:min(420px,100%);display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
.mobile-brand{display:none;align-items:baseline;justify-content:space-between}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding-top:20px}

function calcScore(ans){let s=0,w=0;for(const id in ITENS){const st=(ans||{})[id];if(!st||st==='na')continue;s+=ITENS[id].peso*ST[st].score;w+=ITENS[id].peso}return w?Math.round(s/w*100):null}
function categoria(p){
  if(p==null)return{label:'Sem nota',cls:'',cor:'var(--fg-3)',rec:'Avalie os itens do checklist para gerar a nota.'};
  if(p>=80)return{label:'Excelente',cls:'ok',cor:'var(--ok)',rec:'Compra recomendada. Veículo em ótimo estado.'};
  if(p>=65)return{label:'Bom',cls:'good',cor:'var(--good)',rec:'Compra viável com pequenas ressalvas. Negocie os reparos.'};
  if(p>=50)return{label:'Regular',cls:'warn',cor:'var(--warn)',rec:'Requer atenção. Negocie desconto para cobrir os reparos.'};
  if(p>=35)return{label:'Ruim',cls:'warn',cor:'var(--warn)',rec:'Alto risco. Avalie bem os custos de reparo antes de decidir.'};
  return{label:'Crítico',cls:'bad',cor:'var(--bad)',rec:'Não recomendado. Problemas graves identificados.'};
}
function completude(ans){const t=Object.keys(ITENS).length;const n=Object.keys(ITENS).filter(id=>(ans||{})[id]).length;return Math.round(n/t*100)}
function marcados(a,st){return Object.values(ITENS).filter(i=>(a.answers||{})[i.id]===st)}
function reparos(a){
  const linhas=[];const ov=a.repair_overrides||{};
  Object.values(ITENS).forEach(i=>{const st=(a.answers||{})[i.id];if(st!=='atencao'&&st!=='critico')return;const c=CUSTO[i.id];if(!c)return;
    const padrao=st==='critico'?c[2]:c[3];const editado=ov[i.id]!=null&&ov[i.id]!=='';
    linhas.push({id:i.id,item:i,st,nome:c[0],min:c[1],max:c[2],padrao,valor:editado?num(ov[i.id]):padrao,editado})});
  const extras=(a.extras||[]).map(e=>({...e,valor:num(e.valor)}));
  const total=linhas.reduce((s,l)=>s+l.valor,0)+extras.reduce((s,e)=>s+e.valor,0);
  return{linhas,extras,total};
}

  const ano=parseInt(a.ano)||0,km=num(a.km),fipe=num(a.fipe);if(!ano||!km||!fipe)return null;
  const idade=Math.max(0,new Date().getFullYear()-ano);const esperado=idade*12000;const dif=km-esperado;const d=-dif;
  let adj;if(d<-30000)adj={pct:-20,label:'Muito alta',cls:'bad'};else if(d<-15000)adj={pct:-10,label:'Alta',cls:'warn'};else if(d<-5000)adj={pct:-5,label:'Acima do normal',cls:'warn'};else if(d<=5000)adj={pct:0,label:'Normal',cls:'ok'};else if(d<=15000)adj={pct:5,label:'Baixa',cls:'good'};else adj={pct:15,label:'Muito baixa',cls:'good'};
  return{idade,esperado,km,dif,adj,fipe,ajustado:Math.round(fipe*(1+adj.pct/100))};
}
function negocio(a){
  const f=a.financeiro||{};const pedido=num(f.pedido);const aj=ajusteKm(a);
  const mercado=num(f.mercado)||(aj?aj.ajustado:num(a.fipe));const fonteMercado=num(f.mercado)?'informado':aj?'FIPE ajustada pela km':(num(a.fipe)?'FIPE':'');
  const reparo=reparos(a).total;const lucro=f.lucro===''||f.lucro==null?num(state.perfil.lucro_padrao):num(f.lucro);
  if(!mercado)return{ok:false,pedido,mercado,reparo,lucro,aj,fonteMercado};
  const custo=pedido+reparo;const liquido=mercado-custo;const margem=mercado?liquido/mercado*100:0;const oferta=Math.max(0,mercado-reparo-lucro);
  return{ok:true,pedido,mercado,reparo,lucro,custo,liquido,margem,oferta,aj,fonteMercado,acima:pedido?pedido-oferta:null};
}
function decodeOBD(code){
  const c=code.toUpperCase();const k=OBD[c];const l=c[0],d1=c[1],d2=c[2];
  return{code:c,known:!!k,desc:k?k[0]:null,sev:k?k[1]:null,causas:k?k[2]:[],anat:[LETRA[l]||'?',(d1==='0'||d1==='2')?'Genérico (SAE)':'Específico do fabricante',l==='P'?(SUBP[d2]||''):'']};
}

function ring(p){const c=categoria(p);return `<span class="ring" style="--p:${p??0};--c:${c.cor}"><span>${p==null?'—':p}</span></span>`}
function gauge(p){
  const C=100,R=80;const pt=(v,r=R)=>{const a=Math.PI*(1-v/100);return[(C+r*Math.cos(a)).toFixed(2),(100-r*Math.sin(a)).toFixed(2)]};
  const arc=(v1,v2,r=R)=>{const a=pt(v1,r),b=pt(v2,r);return `M${a[0]} ${a[1]} A${r} ${r} 0 0 1 ${b[0]} ${b[1]}`};
  const cat=categoria(p);
  const zonas=[[0,35,'var(--bad)'],[35,65,'var(--warn)'],[65,80,'var(--good)'],[80,100,'var(--ok)']].map(([a,b,c])=>`<path class="zone" d="${arc(a+.6,b-.6,95)}" style="stroke:${c}"/>`).join('');
  let ticks='';for(let v=0;v<=100;v+=5){const maj=v%25===0;const a=pt(v,maj?86:88),b=pt(v,91);ticks+=`<line class="tick ${maj?'maj':''}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`}
  const labels=[0,50,100].map(v=>{const q=pt(v,72);return `<text class="tl" x="${q[0]}" y="${+q[1]+3}" text-anchor="middle">${v}</text>`}).join('');
  return `<svg class="gauge" viewBox="0 0 200 128" role="img" aria-label="Nota ${p??'sem nota'} de 100, ${cat.label}">
    <path class="trk" d="${arc(0,100)}"/>${zonas}${ticks}
    ${p?`<path class="val" d="${arc(0,Math.max(p,1))}" style="stroke:${cat.cor}"/>`:''}
    ${labels}
    <text class="n" x="100" y="100" text-anchor="middle">${p??'—'}</text>
    <text class="cl" x="100" y="122" text-anchor="middle" style="fill:${cat.cor}">${cat.label.toUpperCase()}</text></svg>`;
}

    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...ink);doc.text(i.label,M+20,y);doc.setTextColor(...gray);doc.text(i.cat.label,M+128,y);doc.setTextColor(...ink);doc.text(l?brl(l.valor):'',W-M,y,{align:'right'});
    if(nl.length){doc.setFontSize(8.3);doc.setTextColor(...gray);doc.text(nl,M+20,y+4.3);doc.setFontSize(9);y+=nl.length*4.3}y+=6.2});
  (a.extras||[]).forEach(e=>{need(7);doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...gray);doc.text('AVULSO',M,y);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...ink);doc.text(String(e.desc||'—').slice(0,80),M+20,y);doc.text(brl(e.valor),W-M,y,{align:'right'});y+=6.2});
  need(10);doc.setDrawColor(...line);doc.line(W-M-60,y-2,W-M,y-2);y+=3;doc.setFont('helvetica','bold');doc.text('Reparos estimados',W-M-60,y);doc.text(brl(r.total),W-M,y,{align:'right'});doc.setFont('helvetica','normal');y+=9;
  if((a.obd||[]).length){sec('Códigos de falha (OBD)');a.obd.forEach(o=>{const d=decodeOBD(o.code);const ds=doc.splitTextToSize(d.desc||o.ai?.descricao||'Código fora da base local',125);need(5+ds.length*4.3);
    doc.setFont('courier','bold');doc.setTextColor(...ink);doc.text(d.code,M,y);doc.setFont('helvetica','normal');doc.text(ds,M+20,y);y+=ds.length*4.3;if(o.nota){doc.setTextColor(...gray);doc.setFontSize(8.3);doc.text(doc.splitTextToSize(o.nota,125),M+20,y);doc.setFontSize(9);y+=4.3}y+=2.5});y+=4}
  sec('Análise do negócio');
  const fin=[['Valor FIPE',a.fipe?brl(a.fipe)+(a.fipe_fonte==='estimativa'?' (estimativa)':''):'—']];
  if(n.aj)fin.push(['Ajuste por quilometragem',`${n.aj.adj.label} (${n.aj.adj.pct>0?'+':''}${n.aj.adj.pct}%) · ${brl(n.aj.ajustado)}`]);
  fin.push(['Valor de mercado considerado',n.mercado?brl(n.mercado)+(n.fonteMercado?' · '+n.fonteMercado:''):'—'],['Preço pedido',n.pedido?brl(n.pedido):'—'],['Reparos estimados',brl(n.reparo)],['Lucro desejado',brl(n.lucro)]);
  if(n.ok&&n.pedido)fin.push(['Custo total',brl(n.custo)],['Resultado líquido',`${n.liquido<0?'-':''}${brl(Math.abs(n.liquido))} (${n.margem.toFixed(1).replace('.',',')}%)`]);
  fin.forEach(f=>{need(6);doc.setTextColor(...gray);doc.text(f[0],M,y);doc.setTextColor(...ink);doc.text(f[1],W-M,y,{align:'right'});y+=5.6});
  if(n.ok){need(14);y+=2;doc.setDrawColor(...line);doc.line(M,y,W-M,y);y+=8;doc.setFont('times','normal');doc.setFontSize(15);doc.text('Oferta máxima sugerida',M,y);doc.text(brl(n.oferta),W-M,y,{align:'right'});doc.setFont('helvetica','normal');doc.setFontSize(9);y+=10}
  if(a.observacoes){sec('Observações do avaliador');doc.setTextColor(...ink);const tx=doc.splitTextToSize(a.observacoes,W-2*M);need(tx.length*4.3);doc.text(tx,M,y);y+=tx.length*4.3+6}
  need(24);y=Math.max(y+12,262);doc.setDrawColor(...gray);doc.setLineWidth(.2);doc.line(M,y,M+75,y);doc.line(W-M-75,y,W-M,y);doc.setFontSize(8);doc.setTextColor(...gray);
  doc.text(pf.responsavel?'Avaliador: '+pf.responsavel:'Avaliador responsável',M,y+4.5);doc.text('Ciente',W-M-75,y+4.5);
  const tp=doc.getNumberOfPages();for(let k=1;k<=tp;k++){doc.setPage(k);doc.setFontSize(7);doc.setTextColor(...gray);doc.text(`DiagCheck Pro · valores de reparo são estimativas de mercado · página ${k} de ${tp}`,W/2,291,{align:'center'})}
  return doc;
}
async function baixarPDF(){
  const a=state.cur;if(!window.jspdf){toast('O gerador de PDF não carregou. Verifique a internet e tente de novo.');return}
  const doc=gerarPDF(a);const nome=`laudo-${fmtPlaca(a.placa)||'veiculo'}-${String(a.numero||0).padStart(4,'0')}.pdf`;
  if(inClaude()){if(!store.downloads){toast('Download indisponível nesta visualização.');return}
    try{await store.downloads.save({filename:nome,data:doc.output('blob')});toast('Laudo salvo')}catch(e){if(e&&e.code!=='declined')toast('Não foi possível salvar o PDF.')}}
  else{doc.save(nome);toast('Laudo baixado')}
}

/* ===================== FIPE (tabela oficial via API pública, fora do Claude) ===================== */
const FIPE_API='https://parallelum.com.br/fipe/api/v1/carros';
async function fj(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
async function fipeAbrir(){
  state.fipe={load:'marcas'};renderEditor();
  try{const m=await fj(FIPE_API+'/marcas');const alvo=(state.cur.marca||'').toLowerCase().replace('mercedes-benz','m.benz');
    const hit=m.find(x=>x.nome.toLowerCase()===alvo)||m.find(x=>alvo&&x.nome.toLowerCase().includes(alvo));
    state.fipe={marcas:m,marca:hit?hit.codigo:''};renderEditor();if(hit)fipeModelos(hit.codigo);
  }catch(e){state.fipe={err:'Não foi possível acessar a tabela FIPE agora. Digite o valor manualmente.'};renderEditor()}
}
async function fipeModelos(m){Object.assign(state.fipe,{marca:m,modelos:null,anos:null,modelo:'',ano:'',load:'modelos',err:''});renderEditor();
  try{const r=await fj(`${FIPE_API}/marcas/${m}/modelos`);state.fipe.modelos=r.modelos;state.fipe.load=null}catch(e){state.fipe.err='Falha ao carregar modelos.';state.fipe.load=null}renderEditor()}
async function fipeAnos(mo){const f=state.fipe;Object.assign(f,{modelo:mo,anos:null,ano:'',load:'anos',err:''});renderEditor();
  try{f.anos=await fj(`${FIPE_API}/marcas/${f.marca}/modelos/${mo}/anos`);f.load=null}catch(e){f.err='Falha ao carregar anos.';f.load=null}renderEditor()}
async function fipeValor(an){const f=state.fipe;Object.assign(f,{ano:an,load:'valor',err:''});renderEditor();
  try{const v=await fj(`${FIPE_API}/marcas/${f.marca}/modelos/${f.modelo}/anos/${an}`);const a=state.cur;
    a.fipe=num(v.Valor);a.fipe_fonte='tabela';a.fipe_ref=`${v.Marca} ${v.Modelo} · ${v.AnoModelo} · ${v.Combustivel} · código ${v.CodigoFipe} · ${v.MesReferencia}`;
    if(!a.ano&&v.AnoModelo<3000)a.ano=String(v.AnoModelo);state.fipe=null;touch();renderEditor();toast('Valor FIPE preenchido')}
  catch(e){f.err='Falha ao buscar o valor.';f.load=null;renderEditor()}}

/* ===================== Claude: estimativa FIPE e códigos fora da base ===================== */
async function fipeIA(){
  const a=state.cur;if(!store.sample)return;state.busy='fipe';renderEditor();
  try{const r=await store.sample.json(`Você conhece a tabela FIPE brasileira de carros. Estime o valor FIPE atual do veículo: ${[a.marca,a.modelo,a.versao,a.ano,a.combustivel,a.cambio].filter(Boolean).join(' ')}. Se não tiver uma referência razoável, responda valor 0. Responda só com JSON: {"valor": número inteiro em reais, "descricao": versão FIPE que você considerou, "confianca": "alta"|"media"|"baixa"}.`,{modelTier:'default'});
    if(r&&num(r.valor)>0){a.fipe=Math.round(num(r.valor));a.fipe_fonte='estimativa';a.fipe_ref=`${r.descricao||''} · confiança ${r.confianca||'baixa'}`;touch();toast('Estimativa preenchida. Confira na tabela oficial.')}
    else toast('O Claude não teve referência confiável para esse modelo. Digite o valor.')}
  catch(e){if(e&&e.code==='not_granted')store.sample=null;else toast('Não foi possível estimar agora.')}
  state.busy=null;renderEditor();
}
async function consultarIA(k){
  const a=state.cur;const o=a.obd[k];if(!store.sample)return;state.busy=k;renderEditor();
  try{const r=await store.sample.json(`Você é técnico automotivo brasileiro. Explique o código OBD-II "${o.code}" para ${[a.marca,a.modelo,a.ano].filter(Boolean).join(' ')||'um carro'}. Responda só com JSON: {"descricao": texto curto em português, "gravidade": "alta"|"media"|"baixa", "causas": [até 4 textos curtos], "dica": uma frase com o primeiro teste a fazer}. Se for código de fabricante e você não tiver certeza, diga isso na descrição.`,{modelTier:'quick'});
    if(r&&r.descricao){o.ai={descricao:String(r.descricao),gravidade:['alta','media','baixa'].includes(r.gravidade)?r.gravidade:null,causas:Array.isArray(r.causas)?r.causas.slice(0,4).map(String):[],dica:r.dica?String(r.dica):''};touch()}}
  catch(e){if(e&&e.code==='not_granted')store.sample=null;else toast('Não foi possível consultar agora.')}
  state.busy=null;renderEditor();
}

/* ===================== Salvamento ===================== */
let saveT=null,fila=Promise.resolve();
function touch(){const a=state.cur;if(!a||a.exemplo)return;state.saving='Salvando…';setSaved();clearTimeout(saveT);saveT=setTimeout(salvar,800)}
function salvar(){const a=state.cur;if(!a||a.exemplo)return;
  fila=fila.then(async()=>{try{const novo=!a.id;await api.save(a);const k=state.list.findIndex(x=>x.id===a.id);if(k>=0)state.list[k]=a;else state.list.unshift(a);
    state.saving='Salvo';setSaved();if(novo){const e=$('#edNum');if(e)e.textContent='Avaliação nº '+String(a.numero).padStart(4,'0')}}
    catch(e){state.saving='Não salvou. Verifique a conexão.';setSaved()}})}
function setSaved(){const e=$('#saved');if(e)e.textContent=state.saving}
let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}

/* atualizações parciais (sem redesenhar o que está sendo digitado) */
function refreshNegocio(){const a=state.cur;const o=negocioOut(a);const f=$('#finOut');if(f)f.innerHTML=o.res;const k=$('#kmOut');if(k)k.innerHTML=o.km;const rp=$('#fn_rep');if(rp)rp.textContent=brl(o.n.reparo)}
function refreshReparos(){const t=$('#repTotal');if(t)t.textContent=brl(reparos(state.cur).total)}
function refreshHead(){const a=state.cur;const t=$('#edTitle');if(t)t.innerHTML=`${titulo(a)} <span class="faint">${esc(a.ano||'')}</span>`;const p=$('#edPlate');if(p)p.innerHTML=plate(a.placa,true)}

/* ===================== Eventos ===================== */
function abrir(id){
  if(id==='exemplo'){state.cur=exemplo();state.step='laudo'}
  else{const x=state.list.find(i=>i.id===id);if(!x)return;state.cur=JSON.parse(JSON.stringify(x));state.step=x.status==='concluido'?'laudo':'veiculo'}
  state.view='editor';state.saving=state.cur.exemplo?'':'Salvo';state.confirmDel=false;state.fipe=null;render();window.scrollTo(0,0);
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-open]');if(!b)return;const d=b.dataset;const a=state.cur;
  if(d.nav){e.preventDefault();if(d.nav==='nova'){state.cur=nova();state.view='editor';state.step='veiculo';state.saving='';state.confirmDel=false;state.fipe=null}else state.view=d.nav;render();window.scrollTo(0,0);return}
  if(d.open){abrir(d.open);return}
  if(d.step){state.step=d.step;state.confirmDel=false;render();window.scrollTo(0,0);return}
  if(d.ans){const cur=a.answers[d.ans];if(cur===d.v)delete a.answers[d.ans];else a.answers[d.ans]=d.v;touch();renderEditor();
    if(d.v==='atencao'||d.v==='critico'){const n=$('#n_'+d.ans);if(n&&!n.value)n.focus({preventScroll:true})}return}
  if(d.allok){const c=CATEGORIAS.find(x=>x.id===d.allok);c.itens.forEach(([id])=>{if(!a.answers[id])a.answers[id]='ok'});touch();renderEditor();return}
  if(d.resetov){delete a.repair_overrides[d.resetov];touch();renderEditor();return}
  if(d.addex){a.extras=a.extras||[];a.extras.push({desc:'',valor:''});touch();renderEditor();const x=$('#exd_'+(a.extras.length-1));if(x)x.focus();return}
  if(d.delex!=null){a.extras.splice(+d.delex,1);touch();renderEditor();return}
  if(d.delobd!=null){a.obd.splice(+d.delobd,1);touch();renderEditor();return}
  if(d.obdrep!=null){const o=a.obd[+d.obdrep];const dd=decodeOBD(o.code);a.extras=a.extras||[];a.extras.push({desc:`${dd.code} · ${dd.desc||o.ai?.descricao||'reparo'}`,valor:''});touch();renderEditor();toast('Adicionado aos reparos. Informe o valor na etapa Reparos.');return}
  if(d.ai!=null){consultarIA(+d.ai);return}
  const act=d.act;if(!act)return;
  if(act==='pdf')baixarPDF();
  if(act==='fipeTabela')fipeAbrir();
  if(act==='fipeFechar'){state.fipe=null;renderEditor()}
  if(act==='fipeIA')fipeIA();
  if(act==='concluir'){a.status='concluido';touch();renderEditor();toast('Avaliação concluída')}
  if(act==='reabrir'){a.status='em_andamento';touch();renderEditor()}
  if(act==='del'){state.confirmDel=true;renderEditor()}
  if(act==='delno'){state.confirmDel=false;renderEditor()}
  if(act==='delok'){try{await api.remove(a.id);state.list=state.list.filter(x=>x.id!==a.id);state.cur=null;state.view='hist';render();toast('Avaliação excluída')}catch(err){toast('Não foi possível excluir. Tente de novo.')}}
  if(act==='authswap'){state.authMode=state.authMode==='entrar'?'criar':'entrar';state.authMsg='';render()}
  if(act==='sair'){await store.sb.auth.signOut();store.user=null;state.list=[];state.loaded=false;render()}
});
document.addEventListener('toggle',e=>{const el=e.target;if(el.matches&&el.matches('details.sys'))state.open[el.dataset.sys]=el.open},true);
document.addEventListener('input',e=>{
  const el=e.target;const a=state.cur;
  if(el.id==='busca'){state.q=el.value;const h=$('#histList');if(h)h.innerHTML=histLista();return}
  if(el.dataset.pf){state.perfil[el.dataset.pf]=el.dataset.pf==='lucro_padrao'?num(el.value):el.value;return}
  if(!a)return;
  if(el.dataset.f){const f=el.dataset.f;let v=el.value;
    if(f==='placa'){v=fmtPlaca(v);el.value=v}
    if(f==='km'||f==='fipe'){v=num(v);if(f==='fipe'){a.fipe_fonte=v?'manual':'';a.fipe_ref=''}}
    a[f]=v;if(['placa','marca','modelo','ano'].includes(f))refreshHead();touch();return}
  if(el.dataset.note){a.notes[el.dataset.note]=el.value;touch();return}
  if(el.dataset.obdnote!=null){a.obd[+el.dataset.obdnote].nota=el.value;touch();return}
  if(el.dataset.ov){a.repair_overrides[el.dataset.ov]=el.value===''?null:num(el.value);if(el.value==='')delete a.repair_overrides[el.dataset.ov];refreshReparos();touch();return}
  if(el.dataset.ex){const [k,f]=el.dataset.ex.split('|');a.extras[+k][f]=f==='valor'?num(el.value):el.value;refreshReparos();touch();return}
  if(el.dataset.fin){a.financeiro=a.financeiro||{};a.financeiro[el.dataset.fin]=el.value===''?'':num(el.value);refreshNegocio();touch();return}
});
document.addEventListener('change',e=>{
  const el=e.target;const a=state.cur;
  if(el.tagName==='SELECT'&&el.dataset.f){a[el.dataset.f]=el.value;refreshHead();touch();return}
  if(el.dataset.fp==='marca'&&el.value)fipeModelos(el.value);
  if(el.dataset.fp==='modelo'&&el.value)fipeAnos(el.value);
  if(el.dataset.fp==='ano'&&el.value)fipeValor(el.value);
  if(el.dataset.f==='km'||el.dataset.f==='fipe'||el.dataset.fin||el.dataset.ov||el.dataset.pf==='lucro_padrao'||(el.dataset.ex&&el.dataset.ex.endsWith('valor'))){if(el.value)el.value=fmtN(el.value)}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='formOBD'){const i=$('#obdIn');const c=i.value.trim().toUpperCase();const m=$('#obdMsg');
    if(!/^[PBCU][0-3][0-9A-F]{3}$/.test(c)){m.textContent='Formato inválido. Use P, B, C ou U seguido de 4 caracteres, como P0300.';m.style.color='var(--bad)';return}
    const a=state.cur;if(a.obd.some(o=>o.code===c)){m.textContent=c+' já está na lista.';return}
    a.obd.push({code:c,nota:''});touch();renderEditor();const n=$('#obdIn');if(n)n.focus();return}
  if(f.id==='formPerfil'){const p=state.perfil;try{await api.savePerfil({nome:p.nome||'',responsavel:p.responsavel||'',telefone:p.telefone||'',documento:p.documento||'',endereco:p.endereco||'',lucro_padrao:num(p.lucro_padrao)||0});$('#pfMsg').textContent='Perfil salvo.'}catch(err){$('#pfMsg').textContent='Não salvou. Verifique a conexão e tente de novo.'}return}
  if(f.id==='formAuth'){const email=$('#au_email').value.trim(),pass=$('#au_pass').value;
    try{if(state.authMode==='entrar'){const {data,error}=await store.sb.auth.signInWithPassword({email,password:pass});if(error)throw error;store.user=data.user;state.authMsg='';await carregar()}
      else{const {data,error}=await store.sb.auth.signUp({email,password:pass});if(error)throw error;if(data.session){store.user=data.user;await carregar()}else{state.authMode='entrar';state.authMsg='Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.';render()}}}
    catch(err){state.authMsg=/invalid login/i.test(err.message||'')?'E-mail ou senha incorretos.':(err.message||'Não foi possível entrar.');render()}}
});
async function carregar(){
  try{const [l,p]=await Promise.all([api.list(),api.getPerfil()]);state.list=l;state.perfil=p||{}}catch(e){toast('Não foi possível carregar os dados.')}
  state.loaded=true;render();
}
(async()=>{render();await initStore();render();if(store.mode!=='supabase'||store.user)await carregar()})();
</script>
