<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Avaliação técnica de carros usados: checklist com pesos, reparos estimados, FIPE ajustada pela quilometragem e oferta máxima.">
<meta name="theme-color" content="#0c0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DiagCheck">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DiagCheck Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Inter:wght@400;500;600&family=Barlow:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: mesa de avaliação premium — trilho lateral grafite no desktop, barra inferior no celular.
   Cada avaliação é um dossiê em 6 etapas: Veículo → Checklist → OBD → Reparos → Negócio → Laudo.
   Assinatura visual: velocímetro de nota (0–100) e placa Mercosul. */
:root{
  --bg:#0c0d10; --surface:#14161a; --surface-2:#1b1e23; --line:#2a2e35; --line-soft:#1f2228;
  --fg:#e9ebee; --fg-2:#a7adb6; --fg-3:#6f7680;
  --silver:#c9ced6; --silver-hi:#f3f5f8; --silver-lo:#8a919b; --ink-on-silver:#0c0d10;
  --ok:#5fb08a; --good:#8fb3d9; --warn:#d6a24a; --bad:#e0645c;
  --ok-bg:rgba(95,176,138,.12); --good-bg:rgba(143,179,217,.12); --warn-bg:rgba(214,162,74,.12); --bad-bg:rgba(224,100,92,.12);
  --plate-blue:#1f3f8f; --paper:#ffffff;
  --metal:linear-gradient(115deg,#7f8690 0%,#e9edf2 28%,#9aa1ab 46%,#f5f7fa 64%,#8d949e 100%);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --line:#d5d9df; --line-soft:#e4e7eb;
  --fg:#121419; --fg-2:#4b525c; --fg-3:#7a818b;
  --silver:#3b4048; --silver-hi:#121419; --silver-lo:#6b727c; --ink-on-silver:#f6f7f9;
  --ok:#2f8a63; --good:#3a6ea5; --warn:#a8741a; --bad:#c2423a;
  --ok-bg:rgba(47,138,99,.10); --good-bg:rgba(58,110,165,.10); --warn-bg:rgba(168,116,26,.10); --bad-bg:rgba(194,66,58,.10);
  --metal:linear-gradient(115deg,#3a3f47 0%,#8d949e 30%,#2b2f35 52%,#9aa1ab 72%,#3a3f47 100%);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --line:#d5d9df; --line-soft:#e4e7eb;
  --fg:#121419; --fg-2:#4b525c; --fg-3:#7a818b;
  --silver:#3b4048; --silver-hi:#121419; --silver-lo:#6b727c; --ink-on-silver:#f6f7f9;
  --ok:#2f8a63; --good:#3a6ea5; --warn:#a8741a; --bad:#c2423a;
  --ok-bg:rgba(47,138,99,.10); --good-bg:rgba(58,110,165,.10); --warn-bg:rgba(168,116,26,.10); --bad-bg:rgba(194,66,58,.10);
  --metal:linear-gradient(115deg,#3a3f47 0%,#8d949e 30%,#2b2f35 52%,#9aa1ab 72%,#3a3f47 100%);
  color-scheme:light;
}
/* estilos de fonte escolhidos no Perfil */
:root[data-font="moderna"]{--f-display:"Inter",system-ui,sans-serif;--f-body:"Inter",system-ui,sans-serif}
:root[data-font="automotiva"]{--f-display:"Barlow",system-ui,sans-serif;--f-body:"Barlow",system-ui,sans-serif}
:root[data-font="moderna"] :is(h1,h2,.brand-name,.stat b,.sys summary .t,.res b,.sum b,.gauge .n),
:root[data-font="automotiva"] :is(h1,h2,.brand-name,.stat b,.sys summary .t,.res b,.sum b,.gauge .n){font-weight:600;letter-spacing:-.02em}
:root[data-font="moderna"] h1 em,:root[data-font="automotiva"] h1 em{font-style:normal;font-weight:400}
:root[data-font="automotiva"] body{font-size:15.5px}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line-soft);padding:28px 18px;display:flex;flex-direction:column;gap:28px;background:var(--bg)}
.brand{display:flex;flex-direction:column;gap:4px;padding-inline:8px}
.brand-name{font-family:var(--f-display);font-size:26px;font-weight:400;line-height:1;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px;border:0;background:none;border-radius:8px;color:var(--fg-2);text-align:left;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.nav button:hover{color:var(--fg);background:var(--surface)}
.nav button[aria-current="true"]{color:var(--fg);background:var(--surface-2)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--fg-3);padding-inline:8px;display:flex;flex-direction:column;gap:8px}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg-3)}
.dot.on{background:var(--ok)}
.main{min-width:0;padding:36px clamp(16px,4vw,56px) 104px}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

/* type */
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-3)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.4vw,46px);line-height:1.05;margin:0;text-wrap:balance}
h1 em{font-style:italic;color:var(--fg-2)}
h2{font-family:var(--f-display);font-weight:400;font-size:25px;margin:0;line-height:1.15;text-wrap:balance}
h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--fg-2);margin:0}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.small{font-size:13px}
.hairline{height:1px;background:var(--metal);opacity:.55;border:0;margin:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--silver-lo)}
.btn.primary{background:var(--silver-hi);color:var(--ink-on-silver);border-color:transparent}
.btn.primary:hover{background:var(--silver)}
.btn.ghost{border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{color:var(--fg);background:var(--surface)}
.btn.danger{color:var(--bad);border-color:transparent}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.input{width:100%;height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);outline:none}
textarea.input{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--silver-lo)}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--fg-3);font-size:13px;pointer-events:none}
.money .input{padding-left:38px;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:24px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--fg-3);margin:0}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:end}
.hero p{margin:12px 0 0;max-width:48ch;color:var(--fg-2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:18px 4px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat+.stat{border-left:1px solid var(--line-soft);padding-left:20px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--fg-3)}

/* list */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:18px;align-items:center;padding:16px 4px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;width:100%;color:inherit}
.item:first-child{border-top:1px solid var(--line-soft)}
.item:hover{background:var(--surface)}
.item-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:13px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-right{text-align:right;font-size:13px;color:var(--fg-2);display:flex;flex-direction:column;gap:2px}
.item-right b{font-weight:500;color:var(--fg);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);color:var(--fg-2);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:transparent;background:var(--ok-bg)}
.pill.good{color:var(--good);border-color:transparent;background:var(--good-bg)}
.pill.warn{color:var(--warn);border-color:transparent;background:var(--warn-bg)}
.pill.bad{color:var(--bad);border-color:transparent;background:var(--bad-bg)}
.empty{padding:40px 24px;text-align:center;border:1px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--fg-2);max-width:46ch}

/* placa Mercosul */
.plate{display:inline-flex;flex-direction:column;width:96px;border-radius:5px;overflow:hidden;border:1.5px solid #20242b;background:#fbfbfc;flex:none}
.plate i{display:block;height:9px;background:var(--plate-blue);color:#fff;font-style:normal;font-size:6px;letter-spacing:.3em;text-align:center;line-height:9px;font-family:var(--f-body);font-weight:600}
.plate b{font-family:var(--f-mono);font-weight:500;color:#15181d;font-size:15px;letter-spacing:.08em;text-align:center;line-height:22px}
.plate.lg{width:150px}.plate.lg i{height:13px;line-height:13px;font-size:8px}.plate.lg b{font-size:23px;line-height:34px}

/* anel pequeno de nota */
.ring{--p:0;--c:var(--ok);width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line-soft) 0);display:grid;place-items:center;flex:none}
.ring span{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.item:hover .ring span{background:var(--surface)}

/* velocímetro */
.gauge{width:100%;max-width:260px;display:block;margin-inline:auto}
.gauge .trk{fill:none;stroke:var(--line-soft);stroke-width:12}
.gauge .zone{fill:none;stroke-width:3;opacity:.7}
.gauge .val{fill:none;stroke-width:12;stroke-linecap:round}
.gauge .tick{stroke:var(--fg-3);stroke-width:1}
.gauge .tick.maj{stroke:var(--fg-2);stroke-width:1.5}
.gauge .tl{fill:var(--fg-3);font-family:var(--f-mono);font-size:8px}
.gauge .n{fill:var(--fg);font-family:var(--f-display);font-size:44px}
.gauge .cl{font-family:var(--f-body);font-size:9.5px;letter-spacing:.18em}

/* editor */
.ed-head{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.saved{font-size:12px;color:var(--fg-3)}
.steps{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.steps::-webkit-scrollbar{display:none}
.steps button{border:0;background:none;padding:14px 12px 13px;color:var(--fg-3);font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.steps button .n{font-family:var(--f-mono);font-size:11px}
.steps button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--silver)}
.steps button:hover{color:var(--fg)}
.badge{font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad-bg);color:var(--bad);display:inline-grid;place-items:center}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-2)}
.bar{width:110px;height:4px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--silver)}

/* checklist */
.sys{border-top:1px solid var(--line-soft)}
.sys:last-child{border-bottom:1px solid var(--line-soft)}
.sys summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px 4px;cursor:pointer}
.sys summary::-webkit-details-marker{display:none}
.sys summary .t{font-family:var(--f-display);font-size:21px;flex:1;min-width:0}
.sys summary .w{font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
.chev{width:16px;height:16px;stroke:var(--fg-3);fill:none;stroke-width:1.6;transition:transform .2s;flex:none}
.sys[open] .chev{transform:rotate(180deg)}
.sys-body{padding:0 4px 18px}
.ck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:12px 0;border-top:1px dashed var(--line-soft);align-items:center}
.ck:first-of-type{border-top:0}
.ck-name{font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ck-name small{font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;background:none;height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;color:var(--fg-3)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"][data-v="ok"]{background:var(--ok-bg);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="atencao"]{background:var(--warn-bg);color:var(--warn)}
.seg button[aria-pressed="true"][data-v="critico"]{background:var(--bad-bg);color:var(--bad)}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--surface-2);color:var(--fg-2)}
.ck-note{grid-column:1/-1}
.ck-note .input{height:38px;font-size:13.5px}

/* identidade visual (Perfil) */
.ident{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
.ident-ctrl{display:flex;flex-direction:column;gap:18px;min-width:0}
.ident-prev{display:flex;flex-direction:column;gap:8px;position:sticky;top:20px}
.fontes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fontopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;color:inherit}
.fontopt:hover{border-color:var(--silver-lo)}
.fontopt[aria-pressed="true"]{border-color:var(--silver-hi);box-shadow:inset 0 0 0 1px var(--silver-hi)}
.fo-a{font-size:30px;line-height:1.1}.fo-n{font-weight:600;font-size:14px}.fo-s{font-size:12px;color:var(--fg-3)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--silver-hi)}
.sw-custom{display:inline-grid;place-items:center;overflow:hidden;background:conic-gradient(#e0645c,#d6a24a,#5fb08a,#3a6ea5,#5b3f8c,#e0645c);cursor:pointer;position:relative}
.sw-custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.logo-thumb{display:inline-grid;place-items:center;height:48px;min-width:64px;max-width:160px;padding:6px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.logo-thumb img{max-height:36px;max-width:140px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--silver-hi)}
.range{width:100%;accent-color:var(--silver-hi)}
.a4{position:relative;width:300px;flex:none;aspect-ratio:210/297;background:var(--paper);border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.18)}
@media (max-width:860px){.ident{grid-template-columns:minmax(0,1fr)}.ident-prev{position:static;align-items:center}}
@media (max-width:560px){.fontes{grid-template-columns:1fr}}
/* tela inicial */
.start{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:28px;align-items:end}
.start-form{display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:16px;background:var(--surface);border:1px solid var(--line-soft)}
.start-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch}
.start-row .btn{height:56px;padding:0 24px;font-size:15px}
.stats4{grid-template-columns:repeat(4,minmax(0,1fr))}
.home-sec{display:flex;flex-direction:column;gap:14px}
.cont{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px}
.cont-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface);text-align:left;color:inherit}
.cont-item:hover{border-color:var(--silver-lo)}
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px}
.stk{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line-soft);border-radius:14px;background:var(--surface);text-align:left;color:inherit}
.stk:hover{border-color:var(--silver-lo)}
.stk-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stk .kv{font-size:13.5px}
.res-neg{display:flex;flex-direction:column;gap:12px}
.seg-wide{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));width:100%}
.seg-wide button{padding:0 6px;font-size:12.5px}
.seg-wide button[aria-pressed="true"]{background:var(--silver-hi);color:var(--ink-on-silver)}
@media (max-width:860px){.start{grid-template-columns:1fr}.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}.stats4 .stat:nth-child(3){border-left:0;padding-left:4px}.stats4 .stat:nth-child(n+3){border-top:1px solid var(--line-soft)}}
@media (max-width:860px){.input{font-size:16px}}
@media (max-width:560px){.plate.lg{width:120px}.plate.lg b{font-size:18px;line-height:28px}.plate.lg i{height:11px;line-height:11px;font-size:7px}}

.chip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg-2);text-align:left;font-size:14px}
.chip:hover{border-color:var(--silver-lo);color:var(--fg)}
.chip .num{font-size:13px;color:var(--fg-3)}
.chip[aria-pressed="true"]{border-color:var(--silver-hi);color:var(--fg);box-shadow:inset 0 0 0 1px var(--silver-hi);background:var(--surface-2)}
.chip[aria-pressed="true"] .num{color:var(--fg)}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:600;margin-right:-4px}
/* histórico */
.svcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.svc{display:flex;flex-direction:column;gap:12px;padding:20px;border:1px solid var(--line-soft);border-radius:14px;background:var(--surface)}
.svc .btn{align-self:flex-start}
.dotst{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dotst.ok{background:var(--ok)}.dotst.warn{background:var(--warn)}.dotst.bad{background:var(--bad)}
.hlist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line-soft);font-size:14px}
.hrow:first-child{border-top:0}
.hrow>.dotst{align-self:center}
.hrow>span:last-child{text-align:right}
.t-bad{color:var(--bad);font-weight:600}.t-warn{color:var(--warn)}.t-ok{color:var(--ok)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
@media (max-width:640px){.svcs{grid-template-columns:1fr}.hrow{grid-template-columns:auto minmax(0,1fr)}.hrow>span:last-child{grid-column:2;text-align:left;max-width:none}}
/* consulta por placa */
.lookup{display:flex;flex-direction:column;gap:14px;background:var(--surface-2);border-color:var(--line)}
.lookup-row{display:grid;grid-template-columns:minmax(0,320px) auto;gap:12px;align-items:end}
.plate-in{height:56px;font-size:24px;letter-spacing:.14em;text-transform:uppercase;text-align:center;background:var(--surface)}
.opt{display:flex;justify-content:space-between;gap:16px;align-items:center;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit}

.opt>span:first-child{display:flex;flex-direction:column;gap:2px}
.linkbtn{border:0;background:none;padding:0;color:var(--fg-2);text-decoration:underline;font-size:inherit;cursor:pointer}

@media (max-width:560px){.lookup-row{grid-template-columns:1fr}}

.fipe-box{border:1px solid var(--line-soft);border-radius:12px;padding:18px;background:var(--surface-2);display:flex;flex-direction:column;gap:14px}
.src{font-size:12px;display:inline-flex;gap:6px;align-items:center}

/* obd */
.obd-entry{display:grid;grid-template-columns:minmax(0,220px) auto 1fr;gap:12px;align-items:end}
.codes{display:flex;flex-direction:column;gap:12px}
.code{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 18px;padding:18px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface);align-items:start}
.code-id{font-family:var(--f-mono);font-size:22px;letter-spacing:.04em;line-height:1.1}
.code-meta{font-size:13px;color:var(--fg-2)}

.code-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sev{width:4px;align-self:stretch;border-radius:2px;background:var(--line)}

.anatomy{display:flex;gap:4px;font-family:var(--f-mono);font-size:11.5px;color:var(--fg-3);margin-top:8px;flex-wrap:wrap}

.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px}

.tabbar{display:none}

function calcScore(ans){let s=0,w=0;for(const id in ITENS){const st=(ans||{})[id];if(!st||st==='na')continue;s+=ITENS[id].peso*ST[st].score;w+=ITENS[id].peso}return w?Math.round(s/w*100):null}
function categoria(p){
  if(p==null)return{label:'Sem nota',cls:'',cor:'var(--fg-3)',rec:'Avalie os itens do checklist para gerar a nota.'};
  if(p>=80)return{label:'Excelente',cls:'ok',cor:'var(--ok)',rec:'Compra recomendada. Veículo em ótimo estado.'};
  if(p>=65)return{label:'Bom',cls:'good',cor:'var(--good)',rec:'Compra viável com pequenas ressalvas. Negocie os reparos.'};
  if(p>=50)return{label:'Regular',cls:'warn',cor:'var(--warn)',rec:'Requer atenção. Negocie desconto para cobrir os reparos.'};
  if(p>=35)return{label:'Ruim',cls:'warn',cor:'var(--warn)',rec:'Alto risco. Avalie bem os custos de reparo antes de decidir.'};
  return{label:'Crítico',cls:'bad',cor:'var(--bad)',rec:'Não recomendado. Problemas graves identificados.'};
}
function completude(ans){const t=Object.keys(ITENS).length;const n=Object.keys(ITENS).filter(id=>(ans||{})[id]).length;return Math.round(n/t*100)}
function marcados(a,st){return Object.values(ITENS).filter(i=>(a.answers||{})[i.id]===st)}
function reparos(a){
  const linhas=[];const ov=a.repair_overrides||{};
  Object.values(ITENS).forEach(i=>{const st=(a.answers||{})[i.id];if(st!=='atencao'&&st!=='critico')return;const c=CUSTO[i.id];if(!c)return;
    const padrao=st==='critico'?c[2]:c[3];const editado=ov[i.id]!=null&&ov[i.id]!=='';
    linhas.push({id:i.id,item:i,st,nome:c[0],min:c[1],max:c[2],padrao,valor:editado?num(ov[i.id]):padrao,editado})});
  const extras=(a.extras||[]).map(e=>({...e,valor:num(e.valor)}));
  const pr=a.preparo||{};const psel=pr.sel||{},pov=pr.ov||{};
  const prep=PREP.filter(p=>psel[p.id]).map(p=>{const ed=pov[p.id]!=null&&pov[p.id]!=='';return{...p,padrao:prepPreco(p.id),valor:ed?num(pov[p.id]):prepPreco(p.id),editado:ed}});
  const prepTotal=prep.reduce((s,p)=>s+p.valor,0);
  const mecanico=linhas.reduce((s,l)=>s+l.valor,0)+extras.reduce((s,e)=>s+e.valor,0);
  return{linhas,extras,prep,prepTotal,mecanico,total:mecanico+prepTotal};
}

function ajusteKm(a){
  const ano=parseInt(a.ano)||0,km=num(a.km),fipe=num(a.fipe);if(!ano||!km||!fipe)return null;
  const idade=Math.max(.5,(Date.now()-new Date(ano-1,9,1).getTime())/3.156e10);const esperado=Math.round(idade*12000/1000)*1000;const dif=km-esperado;const d=-dif;
  let adj;if(d<-30000)adj={pct:-20,label:'Muito alta',cls:'bad'};else if(d<-15000)adj={pct:-10,label:'Alta',cls:'warn'};else if(d<-5000)adj={pct:-5,label:'Acima do normal',cls:'warn'};else if(d<=5000)adj={pct:0,label:'Normal',cls:'ok'};else if(d<=15000)adj={pct:5,label:'Baixa',cls:'good'};else adj={pct:10,label:'Muito baixa',cls:'good'};
  return{idade:Math.round(idade*10)/10,esperado,km,dif,adj,fipe,ajustado:Math.round(fipe*(1+adj.pct/100))};
}
function negocio(a){
  const f=a.financeiro||{};const pedido=num(f.pedido);const aj=ajusteKm(a);
  const mercado=num(f.mercado)||(aj?aj.ajustado:num(a.fipe));const fonteMercado=num(f.mercado)?'informado':aj?'FIPE ajustada pela km':(num(a.fipe)?'FIPE':'');
  const reparo=reparos(a).total;const lucro=f.lucro===''||f.lucro==null?num(state.perfil.lucro_padrao):num(f.lucro);
  if(!mercado)return{ok:false,pedido,mercado,reparo,lucro,aj,fonteMercado};
  const custo=pedido+reparo;const liquido=mercado-custo;const margem=mercado?liquido/mercado*100:0;const oferta=Math.max(0,mercado-reparo-lucro);
  return{ok:true,pedido,mercado,reparo,lucro,custo,liquido,margem,oferta,aj,fonteMercado,acima:pedido?pedido-oferta:null};
}

/* ===================== FIPE de hoje (grátis, tabela oficial pelo código) ===================== */
const fipeHoje={};
const codigoFipe=a=>{const m=/c[oó]digo\s+(\d{6}-\d)/i.exec(a.fipe_ref||'');return m?m[1]:null};
function chaveFipe(a){const c=codigoFipe(a);return c&&a.ano?c+'|'+String(a.ano).slice(0,4):null}
async function buscarFipeHoje(a){
  const k=chaveFipe(a);if(!k||fipeHoje[k])return;
  const ck='fipehoje:'+k+':'+hojeISO();
  try{const c=localStorage.getItem(ck);if(c){fipeHoje[k]=JSON.parse(c);return}}catch(e){}
  fipeHoje[k]={carregando:true};
  try{
    const [cod,ano]=k.split('|');const base='https://parallelum.com.br/fipe/api/v2/cars/'+cod;
    const anos=await (await fetch(base+'/years')).json();const y=(Array.isArray(anos)?anos:[]).find(x=>String(x.code).startsWith(ano));
    if(!y)throw 0;
    const h=await (await fetch(base+'/years/'+y.code+'/history')).json();
    const hist=(h.priceHistory||[]).map(p=>({mes:p.month,valor:num(p.price)}));
    if(!hist.length)throw 0;
    fipeHoje[k]={preco:hist[0].valor,mes:hist[0].mes,hist};
    try{localStorage.setItem(ck,JSON.stringify(fipeHoje[k]))}catch(e){}
  }catch(e){fipeHoje[k]={erro:true}}
  if(state.view==='home'){clearTimeout(window.__stkT);window.__stkT=setTimeout(()=>{if(state.view!=='home')return;const i=$('#startPlaca');const v=i?i.value:'';const foc=i&&document.activeElement===i;render();const j=$('#startPlaca');if(j){j.value=v;if(foc){j.focus();try{j.setSelectionRange(v.length,v.length)}catch(e){}}}},150)}
}

function saudacao(){const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
function falta(a){
  if(!a.modelo&&!a.marca)return 'Falta identificar o veículo';
  const c=completude(a.answers);if(c<100)return `Checklist em ${c}%`;
  if(!num((a.financeiro||{}).pedido))return 'Falta o preço pedido';
  return 'Pronta para concluir';
}
function cardEstoque(a){
  const c=contaNegocio(a);const k=chaveFipe(a);const fh=k?fipeHoje[k]:null;
  let fipeTxt='<span class="faint small">FIPE do dia indisponível</span>',varTxt='',tend=null,margemHoje=c.margemPrev;
  if(fh&&fh.carregando)fipeTxt='<span class="faint small">Buscando FIPE de hoje…</span>';
  if(fh&&fh.preco){
    const base=num(a.fipe)||fh.preco;const dv=(fh.preco-base)/base*100;
    fipeTxt=`<b class="num">${brl(fh.preco)}</b>`;
    varTxt=Math.abs(dv)<.05?'<span class="faint small">igual à avaliação</span>':`<span class="small ${dv<0?'t-bad':'t-ok'}">${dv>0?'+':''}${dv.toFixed(1).replace('.',',')}% desde a avaliação</span>`;
    if(fh.hist.length>=3){const t=(fh.hist[0].valor-fh.hist[2].valor)/fh.hist[2].valor*100;tend=t}
    const f=num(a.financeiro&&a.financeiro.mercado)?fh.preco/(num(a.fipe)||fh.preco):1;
    const merc=num(a.financeiro&&a.financeiro.mercado)?num(a.financeiro.mercado)*f:(c.n.aj?fh.preco*(1+c.n.aj.adj.pct/100):fh.preco);
    if(c.pago)margemHoje=merc-c.pago-c.r.total;
  }
  const avisos=[];
  if(tend!=null&&tend<=-2)avisos.push(`<span class="pill bad">FIPE caiu ${Math.abs(tend).toFixed(1).replace('.',',')}% em 3 meses: hora de girar</span>`);
  else if(tend!=null&&tend>=1)avisos.push(`<span class="pill ok">FIPE subindo ${tend.toFixed(1).replace('.',',')}% em 3 meses</span>`);
  if(c.dias!=null&&c.dias>=60)avisos.push(`<span class="pill warn">Parado há ${c.dias} dias</span>`);
  return `<button class="stk" data-open="${esc(a.id)}">
    <div class="stk-top">${plate(a.placa)}<span class="faint small">${c.dias!=null?(c.dias===0?'comprado hoje':'há '+c.dias+' dia'+(c.dias===1?'':'s')):''}</span></div>
    <div class="item-title">${titulo(a)} <span class="faint num">${esc(a.ano||'')}</span></div>
    <dl class="kv small">
      <dt>Pago</dt><dd>${c.pago?brl(c.pago):'—'}</dd>
      <dt>FIPE hoje</dt><dd>${fipeTxt}</dd>
      ${varTxt?`<dt></dt><dd>${varTxt}</dd>`:''}
      <dt>Margem prevista</dt><dd class="${margemHoje==null?'':margemHoje>=0?'t-ok':'t-bad'}">${margemHoje==null?'—':(margemHoje<0?'−':'')+brl(Math.abs(margemHoje))}</dd>
    </dl>
    ${avisos.length?`<div class="row" style="gap:6px">${avisos.join('')}</div>`:''}
  </button>`;
}

const fontCache={};
async function carregarFontes(id){
  const f=FONTES[id]||FONTES.moderna;

    if(fontCache[file]!==undefined)return;
    try{const r=await fetch('fonts/'+file);if(!r.ok)throw 0;const b=new Uint8Array(await r.arrayBuffer());let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));fontCache[file]=btoa(s)}
    catch(e){fontCache[file]=null}
  }));
}

  f.files.forEach(([file,fam,style])=>{const b=fontCache[file];if(!b){ok=false;return}doc.addFileToVFS(file,b);doc.addFont(file,fam,style)});
  return ok?{body:f.body,title:f.title,titleStyle:f.titleStyle}:{body:'helvetica',title:'times',titleStyle:'normal'};
}

/* ===================== FIPE (tabela oficial via API pública, fora do Claude) ===================== */
const FIPE_API='https://parallelum.com.br/fipe/api/v1/carros';
async function fj(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
async function fipeAbrir(){
  state.fipe={load:'marcas'};renderEditor();
  try{const m=await fj(FIPE_API+'/marcas');if(!state.fipe||state.view!=='editor')return;const alvo=(state.cur.marca||'').toLowerCase().trim();
    const hit=m.find(x=>x.nome.toLowerCase()===alvo)||m.find(x=>alvo&&x.nome.toLowerCase().includes(alvo));
    state.fipe={marcas:m,marca:hit?hit.codigo:''};renderEditor();if(hit)fipeModelos(hit.codigo);
  }catch(e){state.fipe={err:'Não foi possível acessar a tabela FIPE agora. Digite o valor manualmente.'};renderEditor()}
}
async function fipeModelos(m){Object.assign(state.fipe,{marca:m,modelos:null,anos:null,modelo:'',ano:'',load:'modelos',err:''});renderEditor();
  const f=state.fipe;try{const r=await fj(`${FIPE_API}/marcas/${m}/modelos`);if(state.fipe!==f)return;f.modelos=r.modelos;f.load=null}catch(e){if(state.fipe!==f)return;f.err='Falha ao carregar modelos.';f.load=null}renderEditor()}
async function fipeAnos(mo){const f=state.fipe;Object.assign(f,{modelo:mo,anos:null,ano:'',load:'anos',err:''});renderEditor();
  try{const r=await fj(`${FIPE_API}/marcas/${f.marca}/modelos/${mo}/anos`);if(state.fipe!==f)return;f.anos=r;f.load=null}catch(e){if(state.fipe!==f)return;f.err='Falha ao carregar anos.';f.load=null}renderEditor()}
async function fipeValor(an){const f=state.fipe;Object.assign(f,{ano:an,load:'valor',err:''});renderEditor();
  const a=state.cur;try{const v=await fj(`${FIPE_API}/marcas/${f.marca}/modelos/${f.modelo}/anos/${an}`);if(state.fipe!==f||state.cur!==a)return;
    a.fipe=num(v.Valor);a.fipe_fonte='tabela';a.fipe_hist=null;a.fipe_ref=`${v.Marca} ${v.Modelo} · ${v.AnoModelo} · ${v.Combustivel} · código ${v.CodigoFipe} · ${v.MesReferencia}`;
    if(!a.ano&&v.AnoModelo<3000)a.ano=String(v.AnoModelo);state.fipe=null;touch();renderEditor();toast('Valor FIPE preenchido')}
  catch(e){if(state.fipe!==f)return;f.err='Falha ao buscar o valor.';f.load=null;renderEditor()}}

/* ===================== Consulta por placa (função consulta-placa no Supabase) ===================== */
async function buscarPlaca(teste){
  const a=state.cur;const placa=fmtPlaca(a.placa);if(!store.sb)return;
  state.placa={busy:teste?'teste':'real'};renderEditor();
  try{
    const {data,error}=await store.sb.functions.invoke('consulta-placa',{body:{placa:teste?'ABC1234':placa,teste:!!teste}});
    if(error){let msg='Falha na consulta. Tente de novo.';try{const j=await error.context.json();if(j&&j.erro)msg=j.erro}catch(e){}throw new Error(msg)}
    if(!data||!data.opcoes||!data.opcoes.length)throw new Error('Nenhum dado encontrado para essa placa.');
    if(state.cur!==a)return;
    state.placa={res:data,alvo:a};
    if(!teste&&data.opcoes.length===1){aplicarPlaca(0);return}
  }catch(e){if(state.cur!==a)return;state.placa={err:e.message||'Falha na consulta.'}}
  renderEditor();
}
const COMB={gasolina:'Gasolina',diesel:'Diesel','álcool':'Flex',alcool:'Flex',flex:'Flex','alcool/gasolina':'Flex','álcool/gasolina':'Flex',eletrico:'Elétrico','elétrico':'Elétrico',hibrido:'Híbrido','híbrido':'Híbrido'};
const cap=s=>String(s||'').toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
function aplicarPlaca(k){
  const r=state.placa&&state.placa.res;if(!r)return;const a=state.placa.alvo||state.cur;if(a!==state.cur)return;const o=r.opcoes[k];const v=r.veiculo||{};
  if(r.teste){toast('Conexão funcionando. Dados de exemplo não são aplicados.');return}
  if(o.marca)a.marca=MARCAS.find(m=>m.toLowerCase()===String(o.marca).toLowerCase())||(/^m\.?\s?benz|mercedes/i.test(o.marca)?'Mercedes-Benz':cap(o.marca));
  if(o.modelo){a.modelo=o.modelo;const m=o.modelo;
    if(!a.cambio){if(/\bCVT\b/i.test(m))a.cambio='CVT';else if(/\baut\b|aut\.|automático|automatico|tiptronic|\bAT\b|\bDCT\b|\bDSG\b|7G|9G|steptronic|powershift/i.test(m))a.cambio='Automático';else if(/\bmec\b|mec\.|manual/i.test(m))a.cambio='Manual'}
    if(!a.tracao&&/4x4|4matic|quattro|xdrive|\bAWD\b|4motion|\b4WD\b/i.test(m))a.tracao=/4x4|4WD/i.test(m)?'4x4':'AWD'}
  if(o.anoModelo&&Number(o.anoModelo)<3000)a.ano=String(o.anoModelo);
  const c=COMB[String(o.combustivel||v.combustivel||'').toLowerCase()];if(c)a.combustivel=c;
  if(v.cor)a.cor=cap(v.cor);
  const motor=[v.cilindradas?(Number(v.cilindradas)/1000).toFixed(1).replace('.',',')+' L':'',v.potencia?v.potencia+' cv':''].filter(Boolean).join(' · ');if(motor&&!a.versao)a.versao=motor;
  if(o.valor){a.fipe=o.valor;a.fipe_fonte='placa';a.fipe_ref=`${o.marca} ${o.modelo} · ${o.anoModelo} · código ${o.codigoFipe} · ${o.mesReferencia}`;a.fipe_hist=o.historico||null}
  state.placa=null;touch();renderEditor();refreshHead();toast('Dados da placa preenchidos');
}

/* ===================== Claude: estimativa FIPE e códigos fora da base ===================== */
async function fipeIA(){
  const a=state.cur;if(!store.sample)return;state.busy='fipe';renderEditor();
  try{const r=await store.sample.json(`Você conhece a tabela FIPE brasileira de carros. Estime o valor FIPE atual do veículo: ${[a.marca,a.modelo,a.versao,a.ano,a.combustivel,a.cambio].filter(Boolean).join(' ')}. Se não tiver uma referência razoável, responda valor 0. Responda só com JSON: {"valor": número inteiro em reais, "descricao": versão FIPE que você considerou, "confianca": "alta"|"media"|"baixa"}.`,{modelTier:'default'});
    if(r&&num(r.valor)>0){a.fipe=Math.round(num(r.valor));a.fipe_fonte='estimativa';a.fipe_ref=`${r.descricao||''} · confiança ${r.confianca||'baixa'}`;persistir(a);toast('Estimativa preenchida. Confira na tabela oficial.')}
    else toast('O Claude não teve referência confiável para esse modelo. Digite o valor.')}
  catch(e){if(e&&e.code==='not_granted')store.sample=null;else toast('Não foi possível estimar agora.')}
  state.busy=null;renderEditor();
}
async function consultarIA(k){
  const a=state.cur;const o=a.obd[k];if(!store.sample)return;state.busy=k;renderEditor();
  try{const r=await store.sample.json(`Você é técnico automotivo brasileiro. Explique o código OBD-II "${o.code}" para ${[a.marca,a.modelo,a.ano].filter(Boolean).join(' ')||'um carro'}. Responda só com JSON: {"descricao": texto curto em português, "gravidade": "alta"|"media"|"baixa", "causas": [até 4 textos curtos], "dica": uma frase com o primeiro teste a fazer}. Se for código de fabricante e você não tiver certeza, diga isso na descrição.`,{modelTier:'quick'});
    if(r&&r.descricao){o.ai={descricao:String(r.descricao),gravidade:['alta','media','baixa'].includes(r.gravidade)?r.gravidade:null,causas:Array.isArray(r.causas)?r.causas.slice(0,4).map(String):[],dica:r.dica?String(r.dica):''};persistir(a)}}
  catch(e){if(e&&e.code==='not_granted')store.sample=null;else toast('Não foi possível consultar agora.')}
  state.busy=null;renderEditor();
}

/* ===================== Salvamento ===================== */
let saveT=null,saveAlvo=null,fila=Promise.resolve();
function touch(){const a=state.cur;if(!a||a.exemplo)return;saveAlvo=a;state.saving='Salvando…';setSaved();clearTimeout(saveT);saveT=setTimeout(()=>{saveT=null;salvar(saveAlvo)},800)}
function flushSave(){if(saveT){clearTimeout(saveT);saveT=null;salvar(saveAlvo)}}
function persistir(a){if(a===state.cur)touch();else salvar(a)}
function salvar(a){if(!a||a.exemplo)return;
  fila=fila.then(async()=>{try{const novo=!a.id;await api.save(a);const k=state.list.findIndex(x=>x.id===a.id);if(k>=0)state.list[k]=a;else state.list.unshift(a);
    if(a===state.cur){state.saving='Salvo';setSaved();if(novo){const e=$('#edNum');if(e)e.textContent='Avaliação nº '+String(a.numero).padStart(4,'0')}}}
    catch(e){if(a===state.cur){state.saving='Não salvou. Verifique a conexão.';setSaved()}else toast('Uma alteração não foi salva. Verifique a conexão.')}})}
function setSaved(){const e=$('#saved');if(e)e.textContent=state.saving}
let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}

/* atualizações parciais (sem redesenhar o que está sendo digitado) */
function refreshNegocio(){const a=state.cur;const o=negocioOut(a);const f=$('#finOut');if(f)f.innerHTML=o.res;const k=$('#kmOut');if(k)k.innerHTML=o.km;const rp=$('#fn_rep');if(rp)rp.textContent=brl(o.n.reparo)}
function refreshReparos(){const t=$('#repTotal');if(t)t.textContent=brl(reparos(state.cur).total)}
function refreshHead(){const a=state.cur;const t=$('#edTitle');if(t)t.innerHTML=`${titulo(a)} <span class="faint">${esc(a.ano||'')}</span>`;const p=$('#edPlate');if(p)p.innerHTML=plate(a.placa,true)}

/* ===================== Eventos ===================== */
function abrir(id){
  flushSave();
  if(id==='exemplo'){state.cur=exemplo();state.step='laudo'}
  else{const x=state.list.find(i=>i.id===id);if(!x)return;state.cur=JSON.parse(JSON.stringify(x));state.step=x.status==='concluido'?'laudo':'veiculo'}
  state.view='editor';state.saving=state.cur.exemplo?'':'Salvo';state.confirmDel=false;state.fipe=null;state.placa=null;state.hteste=null;state.hconf=null;state.herr=null;render();window.scrollTo(0,0);
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-open]');if(!b)return;const d=b.dataset;const a=state.cur;
  if(d.nav){e.preventDefault();flushSave();if(d.nav==='nova'){state.cur=nova();state.view='editor';state.step='veiculo';state.saving='';state.confirmDel=false;state.fipe=null;state.placa=null;state.hteste=null;state.hconf=null;state.herr=null}else state.view=d.nav;render();window.scrollTo(0,0);return}
  if(d.open){abrir(d.open);return}
  if(d.step){state.step=d.step;state.confirmDel=false;render();window.scrollTo(0,0);return}
  if(d.ans){const cur=a.answers[d.ans];if(cur===d.v)delete a.answers[d.ans];else a.answers[d.ans]=d.v;touch();renderEditor();
    if(d.v==='atencao'||d.v==='critico'){const n=$('#n_'+d.ans);if(n&&!n.value)n.focus({preventScroll:true})}return}
  if(d.allok){const c=CATEGORIAS.find(x=>x.id===d.allok);c.itens.forEach(([id])=>{if(!a.answers[id])a.answers[id]='ok'});touch();renderEditor();return}
  if(d.resetov){delete a.repair_overrides[d.resetov];touch();renderEditor();return}
  if(d.prep){a.preparo=a.preparo||{sel:{},ov:{}};a.preparo.sel=a.preparo.sel||{};a.preparo.sel[d.prep]=!a.preparo.sel[d.prep];if(!a.preparo.sel[d.prep])delete a.preparo.sel[d.prep];touch();renderEditor();return}
  if(d.prepall){a.preparo=a.preparo||{sel:{},ov:{}};a.preparo.sel={};if(d.prepall==='tudo')PREP.filter(p=>p.id!=='vitrificacao').forEach(p=>a.preparo.sel[p.id]=true);touch();renderEditor();toast(d.prepall==='tudo'?'Pacote completo marcado (sem vitrificação)':'Preparação zerada');return}
  if(d.resetpov){if(a.preparo&&a.preparo.ov)delete a.preparo.ov[d.resetpov];touch();renderEditor();return}
  if(d.addex){a.extras=a.extras||[];a.extras.push({desc:'',valor:''});touch();renderEditor();const x=$('#exd_'+(a.extras.length-1));if(x)x.focus();return}
  if(d.delex!=null){a.extras.splice(+d.delex,1);touch();renderEditor();return}
  if(d.delobd!=null){a.obd.splice(+d.delobd,1);touch();renderEditor();return}
  if(d.obdrep!=null){const o=a.obd[+d.obdrep];const dd=decodeOBD(o.code);a.extras=a.extras||[];a.extras.push({desc:`${dd.code} · ${dd.desc||o.ai?.descricao||'reparo'}`,valor:''});touch();renderEditor();toast('Adicionado aos reparos. Informe o valor na etapa Reparos.');return}
  if(d.ai!=null){consultarIA(+d.ai);return}
  if(d.opt!=null){aplicarPlaca(+d.opt);return}
  if(d.dec){a.decisao=a.decisao===d.dec?null:d.dec;
    if(a.decisao==='comprado'||a.decisao==='vendido'){if(!a.preco_pago&&num((a.financeiro||{}).pedido))a.preco_pago=num(a.financeiro.pedido);if(!a.data_compra)a.data_compra=hojeISO()}
    if(a.decisao==='vendido'&&!a.data_venda)a.data_venda=hojeISO();
    if(a.decisao&&a.decisao!=='negociando')a.status='concluido';
    touch();renderEditor();if(a.decisao)toast(DEC[a.decisao].label);return}
  if(d.hask){state.hconf=d.hask;renderEditor();return}
  if(d.hno){state.hconf=null;renderEditor();return}
  if(d.hgo){consultarHist(d.hgo,false);return}
  if(d.htest){consultarHist(d.htest,true);return}
  if(d.hlimpa){state.hteste=null;renderEditor();return}
  if(d.fonte){state.perfil.fonte=d.fonte;aplicarFonte();document.querySelectorAll('.fontopt').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.fonte===d.fonte)));refreshPreview();salvarPerfilDepois();return}
  if(d.cor){state.perfil.cor=d.cor;document.querySelectorAll('.sw[data-cor]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.cor===d.cor)));const ci=$('#pf_cor');if(ci)ci.value=d.cor;refreshPreview();salvarPerfilDepois();return}
  const act=d.act;if(!act)return;
  if(act==='prepPadrao'){state.perfil.prep={};render();salvarPerfilDepois();toast('Preços padrão restaurados');return}
  if(act==='logoRemover'){state.perfil.logo=null;const m={...marcaCfg()};delete m.lw;delete m.lh;state.perfil.marca=m;render();salvarPerfilDepois();return}
  if(act==='pdf')baixarPDF();
  if(act==='fipeTabela')fipeAbrir();
  if(act==='placa')buscarPlaca(false);
  if(act==='placaTeste')buscarPlaca(true);
  if(act==='fipeFechar'){state.fipe=null;renderEditor()}
  if(act==='fipeIA')fipeIA();
  if(act==='concluir'){a.status='concluido';touch();renderEditor();toast('Avaliação concluída')}
  if(act==='reabrir'){a.status='em_andamento';touch();renderEditor()}
  if(act==='del'){state.confirmDel=true;renderEditor()}
  if(act==='delno'){state.confirmDel=false;renderEditor()}
  if(act==='delok'){try{await api.remove(a.id);state.list=state.list.filter(x=>x.id!==a.id);state.cur=null;state.view='hist';render();toast('Avaliação excluída')}catch(err){toast('Não foi possível excluir. Tente de novo.')}}
  if(act==='authswap'){state.authMode=state.authMode==='entrar'?'criar':'entrar';state.authMsg='';render()}
  if(act==='sair'){flushSave();await fila;await store.sb.auth.signOut();store.user=null;state.list=[];state.loaded=false;state.cur=null;state.view='home';state.perfil={};state.q='';aplicarFonte();render()}
});
document.addEventListener('toggle',e=>{const el=e.target;if(el.matches&&el.matches('details.sys'))state.open[el.dataset.sys]=el.open},true);
document.addEventListener('input',e=>{
  const el=e.target;const a=state.cur;
  if(el.id==='startPlaca'){el.value=fmtPlaca(el.value);return}
  if(el.id==='busca'){state.q=el.value;const h=$('#histList');if(h)h.innerHTML=histLista();return}
  if(el.dataset.pf){state.perfil[el.dataset.pf]=el.dataset.pf==='lucro_padrao'?num(el.value):el.value;if(el.dataset.pf==='nome')refreshPreview();salvarPerfilDepois();return}
  if(el.dataset.pp){const pp={...(state.perfil.prep||{})};if(el.value==='')delete pp[el.dataset.pp];else pp[el.dataset.pp]=num(el.value);state.perfil.prep=pp;salvarPerfilDepois();return}
  if(el.id==='pf_cor'){state.perfil.cor=el.value;document.querySelectorAll('.sw[data-cor]').forEach(b=>b.setAttribute('aria-pressed','false'));refreshPreview();salvarPerfilDepois();return}
  if(el.dataset.mc&&el.type==='range'){const k=el.dataset.mc;state.perfil.marca={...marcaCfg(),[k]:Number(el.value)};const o=$('#out_'+k);if(o)o.textContent=el.value+(k==='logo_h'?' mm':k==='wm_tam'?'% da largura':'%');refreshPreview();salvarPerfilDepois();return}
  if(!a)return;
  if(el.dataset.f){const f=el.dataset.f;let v=el.value;
    if(f==='placa'){v=fmtPlaca(v);el.value=v;const bt=$('[data-act="placa"]');if(bt)bt.disabled=!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(v)||!!(state.placa&&state.placa.busy)}
    if(f==='km'||f==='fipe'){v=num(v);if(f==='fipe'){a.fipe_fonte=v?'manual':'';a.fipe_ref='';a.fipe_hist=null}}
    a[f]=v;if(['placa','marca','modelo','ano'].includes(f))refreshHead();touch();return}
  if(el.dataset.note){a.notes[el.dataset.note]=el.value;touch();return}
  if(el.dataset.obdnote!=null){a.obd[+el.dataset.obdnote].nota=el.value;touch();return}
  if(el.dataset.fd){const f=el.dataset.fd;a[f]=/^preco/.test(f)?(el.value===''?null:num(el.value)):(el.value||null);const o=$('#resOut');if(o)o.innerHTML=resultadoOut(a);touch();return}
  if(el.dataset.pov){a.preparo=a.preparo||{sel:{},ov:{}};a.preparo.ov=a.preparo.ov||{};if(el.value==='')delete a.preparo.ov[el.dataset.pov];else a.preparo.ov[el.dataset.pov]=num(el.value);refreshReparos();touch();return}
  if(el.dataset.ov){a.repair_overrides[el.dataset.ov]=el.value===''?null:num(el.value);if(el.value==='')delete a.repair_overrides[el.dataset.ov];refreshReparos();touch();return}
  if(el.dataset.ex){const [k,f]=el.dataset.ex.split('|');a.extras[+k][f]=f==='valor'?num(el.value):el.value;refreshReparos();touch();return}

});

document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='formStart'){flushSave();const i=$('#startPlaca');const pl=fmtPlaca(i.value);
    if(!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(pl)){toast('Placa inválida. Use o formato ABC1D23 ou ABC1234.');i.focus();return}
    state.cur=nova();state.cur.placa=pl;state.view='editor';state.step='veiculo';state.saving='';state.confirmDel=false;state.fipe=null;state.placa=null;state.hteste=null;state.hconf=null;state.herr=null;
    render();window.scrollTo(0,0);if(store.mode==='supabase')buscarPlaca(false);else touch();return}
  if(f.id==='formOBD'){const i=$('#obdIn');const c=i.value.trim().toUpperCase();const m=$('#obdMsg');
    if(!/^[PBCU][0-3][0-9A-F]{3}$/.test(c)){m.textContent='Formato inválido. Use P, B, C ou U seguido de 4 caracteres, como P0300.';m.style.color='var(--bad)';return}
    const a=state.cur;if(a.obd.some(o=>o.code===c)){m.textContent=c+' já está na lista.';return}
    a.obd.push({code:c,nota:''});touch();renderEditor();const n=$('#obdIn');if(n)n.focus();return}
  if(f.id==='formPerfil'){salvarPerfilDepois();return}
  if(f.id==='formAuth'){const email=$('#au_email').value.trim(),pass=$('#au_pass').value;
    try{if(state.authMode==='entrar'){const {data,error}=await store.sb.auth.signInWithPassword({email,password:pass});if(error)throw error;store.user=data.user;state.authMsg='';await carregar()}
      else{const {data,error}=await store.sb.auth.signUp({email,password:pass});if(error)throw error;if(data.session){store.user=data.user;await carregar()}else{state.authMode='entrar';state.authMsg='Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.';render()}}}
    catch(err){state.authMsg=/invalid login/i.test(err.message||'')?'E-mail ou senha incorretos.':(err.message||'Não foi possível entrar.');render()}}
});
async function carregar(){
  try{const [l,p]=await Promise.all([api.list(),api.getPerfil()]);state.list=l;state.perfil=p||{}}catch(e){toast('Não foi possível carregar os dados.')}
  aplicarFonte();
  state.loaded=true;render();
}
(async()=>{aplicarFonte();render();await initStore();render();if(store.mode!=='supabase'||store.user)await carregar()})();
</script>
