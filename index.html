<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Avaliação técnica de carros usados: checklist com pesos, reparos estimados, FIPE ajustada pela quilometragem e oferta máxima.">
<meta name="theme-color" content="#0c0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DiagCheck">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DiagCheck Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Inter:wght@400;500;600&family=Barlow:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: mesa de avaliação premium — trilho lateral grafite no desktop, barra inferior no celular.
   Cada avaliação é um dossiê em 6 etapas: Veículo → Checklist → OBD → Reparos → Negócio → Laudo.
   Assinatura visual: velocímetro de nota (0–100) e placa Mercosul. */
:root{
  --bg:#0c0d10; --surface:#14161a; --surface-2:#1b1e23; --line:#2a2e35; --line-soft:#1f2228;
  --fg:#e9ebee; --fg-2:#a7adb6; --fg-3:#6f7680;
  --silver:#c9ced6; --silver-hi:#f3f5f8; --silver-lo:#8a919b; --ink-on-silver:#0c0d10;
  --ok:#5fb08a; --good:#8fb3d9; --warn:#d6a24a; --bad:#e0645c;
  --ok-bg:rgba(95,176,138,.12); --good-bg:rgba(143,179,217,.12); --warn-bg:rgba(214,162,74,.12); --bad-bg:rgba(224,100,92,.12);
  --plate-blue:#1f3f8f; --paper:#ffffff;
  --metal:linear-gradient(115deg,#7f8690 0%,#e9edf2 28%,#9aa1ab 46%,#f5f7fa 64%,#8d949e 100%);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --line:#d5d9df; --line-soft:#e4e7eb;
  --fg:#121419; --fg-2:#4b525c; --fg-3:#7a818b;
  --silver:#3b4048; --silver-hi:#121419; --silver-lo:#6b727c; --ink-on-silver:#f6f7f9;
  --ok:#2f8a63; --good:#3a6ea5; --warn:#a8741a; --bad:#c2423a;
  --ok-bg:rgba(47,138,99,.10); --good-bg:rgba(58,110,165,.10); --warn-bg:rgba(168,116,26,.10); --bad-bg:rgba(194,66,58,.10);
  --metal:linear-gradient(115deg,#3a3f47 0%,#8d949e 30%,#2b2f35 52%,#9aa1ab 72%,#3a3f47 100%);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --line:#d5d9df; --line-soft:#e4e7eb;
  --fg:#121419; --fg-2:#4b525c; --fg-3:#7a818b;
  --silver:#3b4048; --silver-hi:#121419; --silver-lo:#6b727c; --ink-on-silver:#f6f7f9;
  --ok:#2f8a63; --good:#3a6ea5; --warn:#a8741a; --bad:#c2423a;
  --ok-bg:rgba(47,138,99,.10); --good-bg:rgba(58,110,165,.10); --warn-bg:rgba(168,116,26,.10); --bad-bg:rgba(194,66,58,.10);
  --metal:linear-gradient(115deg,#3a3f47 0%,#8d949e 30%,#2b2f35 52%,#9aa1ab 72%,#3a3f47 100%);
  color-scheme:light;
}
/* estilos de fonte escolhidos no Perfil */
:root[data-font="moderna"]{--f-display:"Inter",system-ui,sans-serif;--f-body:"Inter",system-ui,sans-serif}
:root[data-font="automotiva"]{--f-display:"Barlow",system-ui,sans-serif;--f-body:"Barlow",system-ui,sans-serif}
:root[data-font="moderna"] :is(h1,h2,.brand-name,.stat b,.sys summary .t,.res b,.sum b,.gauge .n),
:root[data-font="automotiva"] :is(h1,h2,.brand-name,.stat b,.sys summary .t,.res b,.sum b,.gauge .n){font-weight:600;letter-spacing:-.02em}
:root[data-font="moderna"] h1 em,:root[data-font="automotiva"] h1 em{font-style:normal;font-weight:400}
:root[data-font="automotiva"] body{font-size:15.5px}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line-soft);padding:28px 18px;display:flex;flex-direction:column;gap:28px;background:var(--bg)}
.brand{display:flex;flex-direction:column;gap:4px;padding-inline:8px}
.brand-name{font-family:var(--f-display);font-size:26px;font-weight:400;line-height:1;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px;border:0;background:none;border-radius:8px;color:var(--fg-2);text-align:left;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.nav button:hover{color:var(--fg);background:var(--surface)}
.nav button[aria-current="true"]{color:var(--fg);background:var(--surface-2)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--fg-3);padding-inline:8px;display:flex;flex-direction:column;gap:8px}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg-3)}
.dot.on{background:var(--ok)}
.main{min-width:0;padding:36px clamp(16px,4vw,56px) 104px}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

/* type */
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-3)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.4vw,46px);line-height:1.05;margin:0;text-wrap:balance}
h1 em{font-style:italic;color:var(--fg-2)}
h2{font-family:var(--f-display);font-weight:400;font-size:25px;margin:0;line-height:1.15;text-wrap:balance}
h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--fg-2);margin:0}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.small{font-size:13px}
.hairline{height:1px;background:var(--metal);opacity:.55;border:0;margin:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--silver-lo)}
.btn.primary{background:var(--silver-hi);color:var(--ink-on-silver);border-color:transparent}
.btn.primary:hover{background:var(--silver)}
.btn.ghost{border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{color:var(--fg);background:var(--surface)}
.btn.danger{color:var(--bad);border-color:transparent}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.input{width:100%;height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);outline:none}
textarea.input{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--silver-lo)}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--fg-3);font-size:13px;pointer-events:none}
.money .input{padding-left:38px;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:24px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--fg-3);margin:0}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:end}
.hero p{margin:12px 0 0;max-width:48ch;color:var(--fg-2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:18px 4px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat+.stat{border-left:1px solid var(--line-soft);padding-left:20px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--fg-3)}

/* list */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:18px;align-items:center;padding:16px 4px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;width:100%;color:inherit}
.item:first-child{border-top:1px solid var(--line-soft)}
.item:hover{background:var(--surface)}
.item-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:13px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-right{text-align:right;font-size:13px;color:var(--fg-2);display:flex;flex-direction:column;gap:2px}
.item-right b{font-weight:500;color:var(--fg);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);color:var(--fg-2);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:transparent;background:var(--ok-bg)}
.pill.good{color:var(--good);border-color:transparent;background:var(--good-bg)}
.pill.warn{color:var(--warn);border-color:transparent;background:var(--warn-bg)}
.pill.bad{color:var(--bad);border-color:transparent;background:var(--bad-bg)}
.empty{padding:40px 24px;text-align:center;border:1px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--fg-2);max-width:46ch}

/* placa Mercosul */
.plate{display:inline-flex;flex-direction:column;width:96px;border-radius:5px;overflow:hidden;border:1.5px solid #20242b;background:#fbfbfc;flex:none}
.plate i{display:block;height:9px;background:var(--plate-blue);color:#fff;font-style:normal;font-size:6px;letter-spacing:.3em;text-align:center;line-height:9px;font-family:var(--f-body);font-weight:600}
.plate b{font-family:var(--f-mono);font-weight:500;color:#15181d;font-size:15px;letter-spacing:.08em;text-align:center;line-height:22px}
.plate.lg{width:150px}.plate.lg i{height:13px;line-height:13px;font-size:8px}.plate.lg b{font-size:23px;line-height:34px}

/* anel pequeno de nota */
.ring{--p:0;--c:var(--ok);width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line-soft) 0);display:grid;place-items:center;flex:none}
.ring span{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.item:hover .ring span{background:var(--surface)}

/* velocímetro */
.gauge{width:100%;max-width:260px;display:block;margin-inline:auto}
.gauge .trk{fill:none;stroke:var(--line-soft);stroke-width:12}
.gauge .zone{fill:none;stroke-width:3;opacity:.7}
.gauge .val{fill:none;stroke-width:12;stroke-linecap:round}
.gauge .tick{stroke:var(--fg-3);stroke-width:1}
.gauge .tick.maj{stroke:var(--fg-2);stroke-width:1.5}
.gauge .tl{fill:var(--fg-3);font-family:var(--f-mono);font-size:8px}
.gauge .n{fill:var(--fg);font-family:var(--f-display);font-size:44px}
.gauge .cl{font-family:var(--f-body);font-size:9.5px;letter-spacing:.18em}

/* editor */
.ed-head{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.ed-id{flex:1 1 300px;min-width:0}.ed-id h2{overflow-wrap:anywhere}
@media (max-width:560px){.ed-head{gap:14px;align-items:center}.ed-head .progress{flex:1 1 100%}.ed-head .progress .bar{flex:1;width:auto}.ed-id h2{font-size:22px;line-height:1.2}}
.saved{font-size:12px;color:var(--fg-3)}
.steps{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.steps::-webkit-scrollbar{display:none}
.steps button{border:0;background:none;padding:14px 12px 13px;color:var(--fg-3);font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.steps button .n{font-family:var(--f-mono);font-size:11px}
.steps button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--silver)}
.steps button:hover{color:var(--fg)}
.badge{font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad-bg);color:var(--bad);display:inline-grid;place-items:center}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-2)}
.bar{width:110px;height:4px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--silver)}

/* checklist */
.sys{border-top:1px solid var(--line-soft)}
.sys:last-child{border-bottom:1px solid var(--line-soft)}
.sys summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px 4px;cursor:pointer}
.sys summary::-webkit-details-marker{display:none}
.sys summary .t{font-family:var(--f-display);font-size:21px;flex:1;min-width:0}
.sys summary .w{font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
.chev{width:16px;height:16px;stroke:var(--fg-3);fill:none;stroke-width:1.6;transition:transform .2s;flex:none}
.sys[open] .chev{transform:rotate(180deg)}
.sys-body{padding:0 4px 18px}
.ck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:12px 0;border-top:1px dashed var(--line-soft);align-items:center}
.ck:first-of-type{border-top:0}
.ck-name{font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ck-name small{font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;background:none;height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;color:var(--fg-3)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"][data-v="ok"]{background:var(--ok-bg);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="atencao"]{background:var(--warn-bg);color:var(--warn)}
.seg button[aria-pressed="true"][data-v="critico"]{background:var(--bad-bg);color:var(--bad)}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--surface-2);color:var(--fg-2)}
.ck-note{grid-column:1/-1}
.ck-note .input{height:38px;font-size:13.5px}

/* identidade visual (Perfil) */
.ident{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
.ident-ctrl{display:flex;flex-direction:column;gap:18px;min-width:0}
.ident-prev{display:flex;flex-direction:column;gap:8px;position:sticky;top:20px}
.fontes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fontopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;color:inherit}
.fontopt:hover{border-color:var(--silver-lo)}
.fontopt[aria-pressed="true"]{border-color:var(--silver-hi);box-shadow:inset 0 0 0 1px var(--silver-hi)}
.fo-a{font-size:30px;line-height:1.1}.fo-n{font-weight:600;font-size:14px}.fo-s{font-size:12px;color:var(--fg-3)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--silver-hi)}
.sw-custom{display:inline-grid;place-items:center;overflow:hidden;background:conic-gradient(#e0645c,#d6a24a,#5fb08a,#3a6ea5,#5b3f8c,#e0645c);cursor:pointer;position:relative}
.sw-custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.logo-thumb{display:inline-grid;place-items:center;height:48px;min-width:64px;max-width:160px;padding:6px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.logo-thumb img{max-height:36px;max-width:140px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--silver-hi)}
.range{width:100%;accent-color:var(--silver-hi)}
.a4{position:relative;width:300px;flex:none;aspect-ratio:210/297;background:var(--paper);border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.18)}
@media (max-width:860px){.ident{grid-template-columns:minmax(0,1fr)}.ident-prev{position:static;align-items:center}}
@media (max-width:560px){.fontes{grid-template-columns:1fr}}
/* tela inicial */
.start{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:28px;align-items:end}
.start-form{display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:16px;background:var(--surface);border:1px solid var(--line-soft)}
.start-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch}
.start-row .btn{height:56px;padding:0 24px;font-size:15px}
.stats4{grid-template-columns:repeat(4,minmax(0,1fr))}
.home-sec{display:flex;flex-direction:column;gap:14px}
.cont{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px}
.cont-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface);text-align:left;color:inherit}
.cont-item:hover{border-color:var(--silver-lo)}
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px}
.stk{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line-soft);border-radius:14px;background:var(--surface);text-align:left;color:inherit}
.stk:hover{border-color:var(--silver-lo)}
.stk-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stk .kv{font-size:13.5px}
.res-neg{display:flex;flex-direction:column;gap:12px}
.seg-wide{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));width:100%}
.seg-wide button{padding:0 6px;font-size:12.5px}
.seg-wide button[aria-pressed="true"]{background:var(--silver-hi);color:var(--ink-on-silver)}
@media (max-width:860px){.start{grid-template-columns:1fr}.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}.stats4 .stat:nth-child(3){border-left:0;padding-left:4px}.stats4 .stat:nth-child(n+3){border-top:1px solid var(--line-soft)}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--silver-hi);color:var(--ink-on-silver);padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.notice{padding:12px 16px;border-radius:10px;background:var(--warn-bg);font-size:13.5px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:var(--bad-bg);font-size:13.5px}
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:min(420px,100%);display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
.mobile-brand{display:none;align-items:baseline;justify-content:space-between}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding-top:20px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--fg-3);padding:6px 0}
  .tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5}
  .tabbar button[aria-current="true"]{color:var(--fg)}
  .mobile-brand{display:flex}
  .hero{grid-template-columns:1fr}
  .report{grid-template-columns:1fr}
  .report-side{position:static}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .item{grid-template-columns:auto minmax(0,1fr) auto;gap:12px}
  .item .plate{display:none}
  .ck{grid-template-columns:1fr}
  .obd-entry{grid-template-columns:1fr auto}
  .obd-entry .hint{grid-column:1/-1}
  .code{grid-template-columns:auto minmax(0,1fr)}
  .code-actions{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap}
  .rep{grid-template-columns:minmax(0,1fr)}
  .rep>.pill{justify-self:start}
  .rep .money{width:100%}
  .stat b{font-size:26px}
  .stat+.stat{padding-left:12px}
  .panel{padding:18px}
  .results{grid-template-columns:1fr}
  .kmadj{grid-template-columns:1fr}
  .kmadj>div+div{border-left:0;border-top:1px solid var(--line-soft)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function reparos(a){
  const linhas=[];const ov=a.repair_overrides||{};const I=a.inspecao||{};const resp=I.resp||{};const ans=a.answers||{};const vistos={};
  Object.values(ITENS).forEach(i=>{const st=ans[i.id];

      linhas.push({id:k,item:i,st:st||'atencao',tipo:'mp',nome:i.mp.l,min:null,max:null,padrao:i.mp.v,valor:ed?num(ov[k]):i.mp.v,editado:ed,prazo:prazoDe(a,i,st)});return}

}

  if(m=t.match(/^(\d{2})\/(\d{2})\/(\d{4})/))d=new Date(+m[3],+m[2]-1,+m[1]);
  else if(m=t.match(/^(\d{4})-(\d{2})-(\d{2})/))d=new Date(+m[1],+m[2]-1,+m[3]);
  else if(m=t.match(/^(\d{2})(\d{2})(\d{4})$/))d=new Date(+m[3],+m[2]-1,+m[1]);

function contaNegocio(a){

  return{n,r,pago,venda,margemPrev:pago&&n.mercado?n.mercado-pago-r.total:null,abaixo:pago&&n.pedido?n.pedido-pago:null,
    lucro:venda&&pago?venda-pago-r.total:null,dias:a.data_compra?diasEntre(a.data_compra,a.decisao==='vendido'?a.data_venda:null):null};
}
function resultadoOut(a){
  const c=contaNegocio(a);const d=a.decisao;
  if(d!=='comprado'&&d!=='vendido')return '';
  const linhas=[];
  if(c.abaixo!=null)linhas.push(['Abaixo do pedido',c.abaixo>=0?brl(c.abaixo):'−'+brl(-c.abaixo)+' acima',c.abaixo>=0?'t-ok':'t-warn']);
  if(c.margemPrev!=null)linhas.push(['Margem prevista',(c.margemPrev<0?'−':'')+brl(Math.abs(c.margemPrev)),c.margemPrev>=0?'t-ok':'t-bad']);
  if(d==='vendido'&&c.lucro!=null)linhas.push(['Lucro na venda',(c.lucro<0?'−':'')+brl(Math.abs(c.lucro)),c.lucro>=0?'t-ok':'t-bad']);
  if(c.dias!=null)linhas.push([d==='vendido'?'Tempo em estoque':'Em estoque há',c.dias+' dia'+(c.dias===1?'':'s'),'']);
  return linhas.length?`<dl class="kv" style="margin-top:4px">${linhas.map(([k,v,cl])=>`<dt>${k}</dt><dd class="${cl}">${v}</dd>`).join('')}</dl><p class="hint" style="margin:6px 0 0">Margem e lucro já descontam reparos e preparação previstos.</p>`:'';
}
function resultadoPanel(a){
  if(a.exemplo||!a.id)return '';
  const d=a.decisao||'';const opts=d==='comprado'||d==='vendido'?['negociando','comprado','vendido','nao_comprado']:['negociando','comprado','nao_comprado'];
  const n=negocio(a);
  return `<div class="panel res-neg">
    <span class="eyebrow">Resultado do negócio</span>
    <div class="seg seg-wide" role="group" aria-label="Resultado do negócio">${opts.map(o=>`<button data-dec="${o}" data-v="${o}" aria-pressed="${d===o}">${o==='comprado'?'Comprei':o==='vendido'?'Vendi':o==='nao_comprado'?'Não comprei':'Negociando'}</button>`).join('')}</div>
    ${d==='comprado'||d==='vendido'?`<div class="grid g2" style="gap:10px">
      <div class="field"><label for="fd_pago">Preço pago</label><div class="money"><span>R$</span><input id="fd_pago" data-fd="preco_pago" class="input" inputmode="numeric" placeholder="${n.pedido?esc(fmtN(n.pedido)):'0'}" value="${esc(fmtN(a.preco_pago))}"></div></div>
      <div class="field"><label for="fd_dc">Data da compra</label><input id="fd_dc" type="date" data-fd="data_compra" class="input" value="${esc(a.data_compra||'')}"></div>
    </div>`:''}
    ${d==='vendido'?`<div class="grid g2" style="gap:10px">
      <div class="field"><label for="fd_venda">Preço de venda</label><div class="money"><span>R$</span><input id="fd_venda" data-fd="preco_venda" class="input" inputmode="numeric" placeholder="0" value="${esc(fmtN(a.preco_venda))}"></div></div>
      <div class="field"><label for="fd_dv">Data da venda</label><input id="fd_dv" type="date" data-fd="data_venda" class="input" value="${esc(a.data_venda||'')}"></div>
    </div>`:''}
    <div id="resOut">${resultadoOut(a)}</div>
  </div>`;
}

/* ===================== FIPE de hoje (grátis, tabela oficial pelo código) ===================== */
const fipeHoje={};
const codigoFipe=a=>{const m=/c[oó]digo\s+(\d{6}-\d)/i.exec(a.fipe_ref||'');return m?m[1]:null};
function chaveFipe(a){const c=codigoFipe(a);return c&&a.ano?c+'|'+String(a.ano).slice(0,4):null}
async function buscarFipeHoje(a){
  const k=chaveFipe(a);if(!k||fipeHoje[k])return;
  const ck='fipehoje:'+k+':'+hojeISO();
  try{const c=localStorage.getItem(ck);if(c){fipeHoje[k]=JSON.parse(c);return}}catch(e){}
  fipeHoje[k]={carregando:true};
  try{
    const [cod,ano]=k.split('|');const base='https://parallelum.com.br/fipe/api/v2/cars/'+cod;
    const anos=await (await fetch(base+'/years')).json();const y=(Array.isArray(anos)?anos:[]).find(x=>String(x.code).startsWith(ano));
    if(!y)throw 0;
    const h=await (await fetch(base+'/years/'+y.code+'/history')).json();
    const hist=(h.priceHistory||[]).map(p=>({mes:p.month,valor:num(p.price)}));
    if(!hist.length)throw 0;
    fipeHoje[k]={preco:hist[0].valor,mes:hist[0].mes,hist};
    try{localStorage.setItem(ck,JSON.stringify(fipeHoje[k]))}catch(e){}
  }catch(e){fipeHoje[k]={erro:true}}
  if(state.view==='home'){clearTimeout(window.__stkT);window.__stkT=setTimeout(()=>{if(state.view!=='home')return;const i=$('#startPlaca');const v=i?i.value:'';const foc=i&&document.activeElement===i;render();const j=$('#startPlaca');if(j){j.value=v;if(foc){j.focus();try{j.setSelectionRange(v.length,v.length)}catch(e){}}}},150)}
}

/* ===================== Tela inicial ===================== */
function saudacao(){const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
function falta(a){
  if(!a.modelo&&!a.marca)return 'Falta identificar o veículo';
  const c=completude(a);if(c<100)return `Checklist em ${c}%`;
  if(!num((a.financeiro||{}).pedido))return 'Falta o preço pedido';
  return 'Pronta para concluir';
}
function cardEstoque(a){
  const c=contaNegocio(a);const k=chaveFipe(a);const fh=k?fipeHoje[k]:null;
  let fipeTxt='<span class="faint small">FIPE do dia indisponível</span>',varTxt='',tend=null,margemHoje=c.margemPrev;
  if(fh&&fh.carregando)fipeTxt='<span class="faint small">Buscando FIPE de hoje…</span>';
  if(fh&&fh.preco){
    const base=num(a.fipe)||fh.preco;const dv=(fh.preco-base)/base*100;
    fipeTxt=`<b class="num">${brl(fh.preco)}</b>`;
    varTxt=Math.abs(dv)<.05?'<span class="faint small">igual à avaliação</span>':`<span class="small ${dv<0?'t-bad':'t-ok'}">${dv>0?'+':''}${dv.toFixed(1).replace('.',',')}% desde a avaliação</span>`;
    if(fh.hist.length>=3){const t=(fh.hist[0].valor-fh.hist[2].valor)/fh.hist[2].valor*100;tend=t}
    const f=num(a.financeiro&&a.financeiro.mercado)?fh.preco/(num(a.fipe)||fh.preco):1;
    const merc=num(a.financeiro&&a.financeiro.mercado)?num(a.financeiro.mercado)*f:(c.n.aj?fh.preco*(1+c.n.aj.adj.pct/100):fh.preco);
    if(c.pago)margemHoje=merc-c.pago-c.r.total;
  }
  const avisos=[];
  if(tend!=null&&tend<=-2)avisos.push(`<span class="pill bad">FIPE caiu ${Math.abs(tend).toFixed(1).replace('.',',')}% em 3 meses: hora de girar</span>`);
  else if(tend!=null&&tend>=1)avisos.push(`<span class="pill ok">FIPE subindo ${tend.toFixed(1).replace('.',',')}% em 3 meses</span>`);
  if(c.dias!=null&&c.dias>=60)avisos.push(`<span class="pill warn">Parado há ${c.dias} dias</span>`);
  return `<button class="stk" data-open="${esc(a.id)}">
    <div class="stk-top">${plate(a.placa)}<span class="faint small">${c.dias!=null?(c.dias===0?'comprado hoje':'há '+c.dias+' dia'+(c.dias===1?'':'s')):''}</span></div>
    <div class="item-title">${titulo(a)} <span class="faint num">${esc(a.ano||'')}</span></div>
    <dl class="kv small">
      <dt>Pago</dt><dd>${c.pago?brl(c.pago):'—'}</dd>
      <dt>FIPE hoje</dt><dd>${fipeTxt}</dd>
      ${varTxt?`<dt></dt><dd>${varTxt}</dd>`:''}
      <dt>Margem prevista</dt><dd class="${margemHoje==null?'':margemHoje>=0?'t-ok':'t-bad'}">${margemHoje==null?'—':(margemHoje<0?'−':'')+brl(Math.abs(margemHoje))}</dd>
    </dl>
    ${avisos.length?`<div class="row" style="gap:6px">${avisos.join('')}</div>`:''}
  </button>`;
}

async function processarLogo(file){

  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Não consegui abrir essa imagem.'));i.src=url});

  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);

  let b=box(true)||box(false);if(!b)throw new Error('A imagem parece estar vazia.');
  const pad=Math.round(Math.max(b[2]-b[0],b[3]-b[1])*.02);b=[Math.max(0,b[0]-pad),Math.max(0,b[1]-pad),Math.min(w-1,b[2]+pad),Math.min(h-1,b[3]+pad)];
  let cw=b[2]-b[0]+1,ch=b[3]-b[1]+1;let lum=0,cnt=0;for(let yy=b[1];yy<=b[3];yy+=3)for(let xx=b[0];xx<=b[2];xx+=3){const i=(yy*w+xx)*4;if(d[i+3]>120){lum+=.299*d[i]+.587*d[i+1]+.114*d[i+2];cnt++}}
  const claro=cnt&&lum/cnt>225;
  const mk=max=>{const k=Math.min(1,max/Math.max(cw,ch));const o=document.createElement('canvas');o.width=Math.round(cw*k);o.height=Math.round(ch*k);o.getContext('2d').drawImage(c,b[0],b[1],cw,ch,0,0,o.width,o.height);return{src:o.toDataURL('image/png'),w:o.width,h:o.height}};
  let r=mk(900);if(r.src.length>380000)r=mk(600);if(r.src.length>380000)r=mk(420);
  return{...r,claro};
}

function statusLeilao(l){if(!l)return null;const regs=l.registros||[];
  if(regs.some(r=>r.seguradora||GRAVE.test(r.condicao+' '+r.classificacao)))return{cls:'bad',label:'Leilão de sinistro'};

function linhasHistorico(a){
  const h=a.historico,l=a.leilao;const L=[];
  if(h){const f=h.flags||{};const m=h.multas||{};
    L.push(['Roubo ou furto',f.roubo_furto?'CONSTA registro':'Nada consta',f.roubo_furto?'bad':'ok']);
    L.push(['Bloqueio judicial (Renajud)',f.renajud?`CONSTA (${(h.renajud||[]).length||1})`:'Nada consta',f.renajud?'bad':'ok']);
    const motivos=(h.mensagens||[]).map(traduzRestricao).filter(Boolean);
    if(f.restricao_geral||motivos.length){
      if(motivos.length)motivos.forEach(([t,c])=>L.push(['Restrição administrativa',t,c]));
      else L.push(['Restrições administrativas','Consta restrição (sem detalhe do Detran)','warn']);

    if(f.baixado)L.push(['Veículo baixado','CONSTA','bad']);
    L.push(['Multas (Renainf)',m.qtd?`${m.qtd} registro${m.qtd>1?'s':''}${m.total?' · '+brl(m.total)+' em aberto':''}`:'Nada consta',m.total>0?'warn':'ok']);
    L.push(['Recall',h.recall&&h.recall.qtd?`${h.recall.qtd} campanha${h.recall.qtd>1?'s':''}`:'Nada consta',h.recall&&h.recall.qtd?'warn':'ok']);
    if(h.comunicado_venda&&h.comunicado_venda.qtd)L.push(['Comunicado de venda',`${h.comunicado_venda.qtd} registro(s)`,'warn']);
    (h.alertas||[]).forEach(x=>L.push([frase(x.descricao)||'Alerta',frase(x.mensagem),x.severidade>=3?'bad':'warn']));
  }else L.push(['Roubo, Renajud, restrições e multas','Não consultado','']);
  if(l){const regs=l.registros||[];const n=l.qtd||regs.length;const st=statusLeilao(l);
    L.push(['Leilão',n?`${n} registro${n>1?'s':''}`:'Nada consta',st.cls]);
    regs.slice(0,4).forEach(r=>L.push([`Leilão em ${r.data&&!/0001|0000/.test(r.data)?r.data:'data não informada'}`,[r.seguradora?'Seguradora: '+frase(r.comitente):JUDICIAL.test(r.comitente)?'Leilão judicial: '+frase(r.comitente):frase(r.comitente),frase(r.condicao),r.classificacao&&!/nao foi possivel|não foi possível/i.test(r.classificacao)?frase(r.classificacao):''].filter(x=>x&&!/^n[aã]o (informado|divulgado)$/i.test(x)).join(' · ')||'Sem detalhes',r.seguradora||GRAVE.test(r.condicao+' '+r.classificacao)?'bad':'warn']));
    if(l.parecer)L.push(['Parecer da consulta de leilão',frase(l.parecer),/nao foi encontrado|não foi encontrado|sem risco/i.test(l.parecer)?'ok':'warn']);
  }else L.push(['Leilão e sinistro','Não consultado','']);
  return L;
}

async function consultarHist(servico,teste){

    if(error){let msg='Falha na consulta. Tente de novo.';try{const j=await error.context.json();if(j&&j.erro)msg=j.erro}catch(e){}throw new Error(msg)}

}

const pads={};
function desenharTracos(c,tracos){tracos.forEach(t=>{if(!t.length)return;c.beginPath();c.moveTo(t[0].x,t[0].y);if(t.length===1)c.lineTo(t[0].x+.1,t[0].y+.1);else{for(let i=1;i<t.length-1;i++){const mx=(t[i].x+t[i+1].x)/2,my=(t[i].y+t[i+1].y)/2;c.quadraticCurveTo(t[i].x,t[i].y,mx,my)}const u=t[t.length-1];c.lineTo(u.x,u.y)}c.stroke()})}
function estiloTinta(c){c.lineCap='round';c.lineJoin='round';c.strokeStyle='#15181d';c.lineWidth=2.3}
function redesenharPad(k){const q=pads[k];if(!q||!q.ctx)return;q.ctx.clearRect(0,0,q.w,q.h);desenharTracos(q.ctx,q.tracos)}
function initPads(){document.querySelectorAll('[data-pad]').forEach(box=>{
  const k=box.dataset.pad;const cv=box.querySelector('canvas');if(!cv)return;
  const q=pads[k]=pads[k]||{tracos:[]};const r=box.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);estiloTinta(c);q.ctx=c;q.w=r.width;q.h=r.height;redesenharPad(k);box.classList.toggle('sujo',q.tracos.length>0);
  if(cv._lig)return;cv._lig=1;let atual=null;
  const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}atual=[pos(e)];pads[k].tracos.push(atual);box.classList.add('sujo');redesenharPad(k)});
  cv.addEventListener('pointermove',e=>{if(!atual)return;e.preventDefault();(e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>atual.push(pos(ev)));redesenharPad(k)});
  const fim=()=>{atual=null};['pointerup','pointercancel','lostpointercapture'].forEach(t=>cv.addEventListener(t,fim));
})}
window.addEventListener('resize',()=>{if(state.view==='editor'&&state.step==='checklist')initPads()});
function exportarPad(P){
  const pts=[].concat(...P.tracos);if(pts.length<4)return null;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;pts.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)});
  if(x1-x0<12&&y1-y0<12)return null;
  x0-=6;y0-=6;x1+=6;y1+=6;const w=x1-x0,h=y1-y0;const s=Math.min(3,600/w,220/h);
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*s));cv.height=Math.max(1,Math.round(h*s));
  const c=cv.getContext('2d');c.setTransform(s,0,0,s,-x0*s,-y0*s);estiloTinta(c);desenharTracos(c,P.tracos);
  return{img:cv.toDataURL('image/png'),w:cv.width,h:cv.height};
}

const MIDIA_BUCKET='midia',MAX_VIDEO=30*1048576;
const localMidia={},urlCache={};
const limpaMime=m=>String(m||'').split(';')[0].trim().toLowerCase();
function imgMidia(m){const u=(localMidia[m.id]&&localMidia[m.id].t)||(m.t&&urlCache[m.t]&&urlCache[m.t].exp>Date.now()?urlCache[m.t].url:null);
  return u?`<img src="${u}" alt="" loading="lazy">`:m.t?`<img data-mt="${esc(m.t)}" alt="">`:'<span class="mt-sem"></span>'}
async function assinar(paths,seg){seg=seg||3600;const lista=[...new Set(paths.filter(Boolean))];const falta=lista.filter(p=>!(urlCache[p]&&urlCache[p].exp>Date.now()+60000));
  if(falta.length&&store.sb){try{const {data,error}=await store.sb.storage.from(MIDIA_BUCKET).createSignedUrls(falta,seg);if(!error)(data||[]).forEach(d=>{const u=d.signedUrl||d.signedURL;if(u&&d.path)urlCache[d.path]={url:u,exp:Date.now()+seg*1000}})}catch(e){}}
  return paths.map(p=>p&&urlCache[p]?urlCache[p].url:null)}
async function hidratarMidia(){const imgs=[...document.querySelectorAll('img[data-mt]')];if(!imgs.length)return;const us=await assinar(imgs.map(i=>i.dataset.mt));imgs.forEach((im,k)=>{if(us[k]){im.src=us[k];im.removeAttribute('data-mt')}})}
async function adicionarMidia(a,item,tipo,blob,thumb,meta){
  const I=insp(a);marcaV2(a,item);const mid='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const mime=limpaMime(meta.mime||blob.type)||(tipo==='foto'?'image/jpeg':'video/mp4');
  const ext=tipo==='foto'?'jpg':/webm/.test(mime)?'webm':/quicktime/.test(mime)?'mov':'mp4';
  const m={id:mid,tipo,ext,w:meta.w||null,h:meta.h||null,dur:meta.dur?Math.round(meta.dur*10)/10:null,em:new Date().toISOString(),pend:1};
  (I.midia[item]=I.midia[item]||[]).push(m);
  localMidia[mid]={t:URL.createObjectURL(thumb||blob),f:URL.createObjectURL(blob)};
  await filaMidia.put({key:mid,aval:I.lk,item,tipo,blob,thumb:thumb||null,meta:{ext,mime},criado:Date.now()});
  persistir(a);if(a===state.cur){if(state.sheet===item)refreshSheet();else refreshLinha(item)}
  enviarPendentes();

let enviando=false,reenvioT=null;
async function enviarPendentes(){
  if(enviando||store.mode!=='supabase'||!store.user)return;enviando=true;clearTimeout(reenvioT);let falhou=false;
  try{const recs=await filaMidia.all();
    for(const rec of recs){
      const x=[state.cur,...state.list].find(e=>e&&e.inspecao&&e.inspecao.lk===rec.aval);if(!x)continue;
      const m=(((x.inspecao.midia||{})[rec.item])||[]).find(z=>z.id===rec.key);
      if(!m){await filaMidia.del(rec.key);continue} // apagada antes de enviar
      if(!x.id){if(x===state.cur){flushSave();await fila}if(!x.id){falhou=true;continue}}
      const base=`${store.user.id}/${x.id}/${rec.item}/${rec.key}`;const st=store.sb.storage.from(MIDIA_BUCKET);
      const u1=await st.upload(`${base}.${rec.meta.ext}`,rec.blob,{contentType:rec.meta.mime,upsert:true,cacheControl:'31536000'});
      if(u1.error){falhou=true;state.midiaErro=/bucket/i.test(u1.error.message||'')?'O envio de fotos ainda não foi ativado no servidor. Elas ficam guardadas neste aparelho.':'Sem conexão para enviar. As fotos ficam guardadas neste aparelho e o envio continua sozinho.';continue}
      let tp=`${base}.${rec.meta.ext}`;
      if(rec.thumb){const u2=await st.upload(`${base}_t.jpg`,rec.thumb,{contentType:'image/jpeg',upsert:true,cacheControl:'31536000'});if(!u2.error)tp=`${base}_t.jpg`}
      m.p=`${base}.${rec.meta.ext}`;m.t=tp;delete m.pend;await filaMidia.del(rec.key);state.midiaErro='';
      persistir(x);if(x===state.cur&&state.view==='editor'){if(state.sheet===rec.item)refreshSheet();else refreshLinha(rec.item)}
    }
  }catch(e){falhou=true}
  finally{enviando=false}
  if(falhou)reenvioT=setTimeout(enviarPendentes,30000);
}
async function apagarMidia(a,item,mid){
  const I=insp(a);const l=I.midia[item]||[];const k=l.findIndex(m=>m.id===mid);if(k<0)return;const m=l[k];l.splice(k,1);if(!l.length)delete I.midia[item];
  try{await filaMidia.del(mid)}catch(e){}
  const paths=[...new Set([m.p,m.t].filter(Boolean))];if(paths.length&&store.sb)store.sb.storage.from(MIDIA_BUCKET).remove(paths).catch(()=>{});
  if(m.qr&&store.sb){try{store.sb.from('midia_links').delete().eq('code',m.qr).then(()=>{},()=>{})}catch(e){}}
  if(localMidia[mid]){URL.revokeObjectURL(localMidia[mid].t);URL.revokeObjectURL(localMidia[mid].f);delete localMidia[mid]}
  persistir(a);
}
async function apagarMidiasDa(a){ // ao excluir a avaliação
  const I=a.inspecao||{};const todas=Object.values(I.midia||{}).flat();const paths=[...new Set(todas.flatMap(m=>[m.p,m.t]).filter(Boolean))];
  if(paths.length&&store.sb){try{await store.sb.storage.from(MIDIA_BUCKET).remove(paths)}catch(e){}}
  const cods=todas.map(m=>m.qr).filter(Boolean);if(cods.length&&store.sb){try{await store.sb.from('midia_links').delete().in('code',cods)}catch(e){}}
  try{const recs=await filaMidia.all();for(const r of recs)if(r.aval===I.lk)await filaMidia.del(r.key)}catch(e){}
}

  for(const f of files){
    try{

        if(f.size>MAX_VIDEO){state.midiaMsg=`Vídeo muito grande (${Math.round(f.size/1048576)} MB). O limite é 30 MB: grave pelo botão “Vídeo 15 s”.`;continue}
        let th=null,dur=null,w=null,h=null;try{const t=await thumbDeVideo(f);th=t.thumb;dur=t.dur;w=t.w;h=t.h}catch(e){}
        await adicionarMidia(a,item,'video',f,th,{mime:f.type,w,h,dur});

function cliqueCk(d,a){
  if(d.sec){irSecao(d.sec);return true}
  if(d.secnav){const k=SECOES.findIndex(s=>s.id===secAtual(a))+Number(d.secnav);
    if(k<0){state.step='historico';render();window.scrollTo(0,0);return true}
    if(k>=SECOES.length){state.step='obd';render();window.scrollTo(0,0);return true}
    irSecao(SECOES[k].id);return true}
  if(d.resp){const it=ITENS[d.resp];const I=insp(a);const prev=I.resp[d.resp];
    if(prev===d.v){delete I.resp[d.resp];if(I.auto[d.resp]){delete a.answers[d.resp];delete I.auto[d.resp]}}
    else{I.resp[d.resp]=d.v;const cur=a.answers[d.resp];if(!cur||I.auto[d.resp]){a.answers[d.resp]=ruim(it,d.v)?'atencao':'ok';I.auto[d.resp]=1}}
    marcaV2(a,d.resp);touch();if(state.sheet)refreshSheet();else{refreshLinha(d.resp);refreshCk()}return true}
  if(d.ans){const cur=a.answers[d.ans];if(cur===d.v)delete a.answers[d.ans];else a.answers[d.ans]=d.v;if(a.inspecao&&a.inspecao.auto)delete a.inspecao.auto[d.ans];
    marcaV2(a,d.ans);touch();if(state.sheet)refreshSheet();else{refreshLinha(d.ans);refreshCk()}return true}
  if(d.allok){const s=SECAO[d.allok];if(!s)return true;s.itens.forEach(i=>{if(!i.q&&!a.answers[i.id]){a.answers[i.id]='ok';marcaV2(a,i.id)}});touch();renderEditor();return true}
  if(d.mais){abrirFolha(d.mais);return true}
  if(d.shfecha){fecharFolha();return true}
  if(d.prazo){insp(a).prazo[d.prazo]=Number(d.v);touch();refreshSheet();return true}
  if(d.grava){gravarVideo(d.grava);return true}

async function buscarPlaca(teste){

const COMB={gasolina:'Gasolina',diesel:'Diesel','álcool':'Flex',alcool:'Flex',flex:'Flex','alcool/gasolina':'Flex','álcool/gasolina':'Flex',eletrico:'Elétrico','elétrico':'Elétrico',hibrido:'Híbrido','híbrido':'Híbrido'};

    if(!a.cambio){if(/\bCVT\b/i.test(m))a.cambio='CVT';else if(/\baut\b|aut\.|automático|automatico|tiptronic|\bAT\b|\bDCT\b|\bDSG\b|7G|9G|steptronic|powershift/i.test(m))a.cambio='Automático';else if(/\bmec\b|mec\.|manual/i.test(m))a.cambio='Manual'}

});
document.addEventListener('change',async e=>{
  const el=e.target;const a=state.cur;
  if(el.dataset.mc&&el.type==='checkbox'){state.perfil.marca={...marcaCfg(),[el.dataset.mc]:el.checked};render();salvarPerfilDepois();return}
  if(el.id==='pf_logo'&&el.files&&el.files[0]){const m=$('#logoMsg');if(m)m.textContent='Preparando a imagem…';
    try{const r=await processarLogo(el.files[0]);state.perfil.logo=r.src;state.perfil.marca={...marcaCfg(),lw:r.w,lh:r.h};render();salvarPerfilDepois();
      const m2=$('#logoMsg');if(m2&&r.claro){m2.textContent='Atenção: seu logo é muito claro e pode sumir no papel branco. Se tiver a versão escura, envie ela.';m2.style.color='var(--warn)'}}
    catch(err){const m3=$('#logoMsg');if(m3){m3.textContent=err.message;m3.style.color='var(--bad)'}}return}
  if(el.dataset.up&&el.files&&el.files.length&&a){const files=[...el.files];el.value='';processarArquivos(el.dataset.up,files);return}
  if(el.tagName==='SELECT'&&el.dataset.f){a[el.dataset.f]=el.value;refreshHead();touch();return}
  if(el.dataset.fp==='marca'&&el.value)fipeModelos(el.value);
  if(el.dataset.fp==='modelo'&&el.value)fipeAnos(el.value);
  if(el.dataset.fp==='ano'&&el.value)fipeValor(el.value);
  if(el.dataset.f==='km'||el.dataset.km==='km_ano'||el.dataset.f==='fipe'||el.dataset.fin||(el.dataset.ov&&el.id==='shC')||(el.dataset.fd&&/^preco/.test(el.dataset.fd))||el.dataset.ov||el.dataset.pf==='lucro_padrao'||(el.dataset.ex&&el.dataset.ex.endsWith('valor'))){if(el.value)el.value=fmtN(el.value)}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='formStart'){flushSave();const i=$('#startPlaca');const pl=fmtPlaca(i.value);
    if(!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(pl)){toast('Placa inválida. Use o formato ABC1D23 ou ABC1234.');i.focus();return}
    state.cur=nova();state.cur.placa=pl;state.sec=null;state.sheet=null;state.view='editor';state.step='veiculo';state.saving='';state.confirmDel=false;state.fipe=null;state.placa=null;state.hteste=null;state.hconf=null;state.herr=null;
    render();window.scrollTo(0,0);if(store.mode==='supabase')buscarPlaca(false);else touch();return}
  if(f.id==='formOBD'){const i=$('#obdIn');const c=i.value.trim().toUpperCase();const m=$('#obdMsg');
    if(!/^[PBCU][0-3][0-9A-F]{3}$/.test(c)){m.textContent='Formato inválido. Use P, B, C ou U seguido de 4 caracteres, como P0300.';m.style.color='var(--bad)';return}
    const a=state.cur;if(a.obd.some(o=>o.code===c)){m.textContent=c+' já está na lista.';return}
    a.obd.push({code:c,nota:''});touch();renderEditor();const n=$('#obdIn');if(n)n.focus();return}
  if(f.id==='formPerfil'){salvarPerfilDepois();return}
  if(f.id==='formAuth'){const email=$('#au_email').value.trim(),pass=$('#au_pass').value;
    try{if(state.authMode==='entrar'){const {data,error}=await store.sb.auth.signInWithPassword({email,password:pass});if(error)throw error;store.user=data.user;state.authMsg='';await carregar()}
      else{const {data,error}=await store.sb.auth.signUp({email,password:pass});if(error)throw error;if(data.session){store.user=data.user;await carregar()}else{state.authMode='entrar';state.authMsg='Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.';render()}}}
    catch(err){state.authMsg=/invalid login/i.test(err.message||'')?'E-mail ou senha incorretos.':(err.message||'Não foi possível entrar.');render()}}
});
async function carregar(){
  try{const [l,p]=await Promise.all([api.list(),api.getPerfil()]);state.list=l;state.perfil=p||{}}catch(e){toast('Não foi possível carregar os dados.')}
  aplicarFonte();
  state.loaded=true;render();carregarPendentes();
}
document.addEventListener('keydown',e=>{if(e.key!=='Escape'||document.querySelector('.gv-root'))return;if($('#vw')){fecharViewer();return}if(state.sheet)fecharFolha()});
window.addEventListener('online',()=>enviarPendentes());
(async()=>{aplicarFonte();render();await initStore();render();if(store.mode!=='supabase'||store.user)await carregar()})();
</script>
